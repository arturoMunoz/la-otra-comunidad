name: APK Android
on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/apk.yml']
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - run: gradle -p android assembleRelease --no-daemon
      - run: cp android/app/build/outputs/apk/release/app-release.apk la-otra-comunidad.apk
      - uses: actions/upload-artifact@v4
        with: { name: la-otra-comunidad-apk, path: la-otra-comunidad.apk }
      - name: Publicar como descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: App de pasos para Android
          body: Descarga la-otra-comunidad.apk e instálala en el móvil.
          files: la-otra-comunidad.apk
          make_latest: true
