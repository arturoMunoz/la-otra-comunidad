<body>
<div id="menu">
  <h1>El Vado del Isen</h1>

  <div class="fila" id="heroes"></div>
  <div class="modos"><button data-m="1v1" class="on">1 contra 1</button><button data-m="2v2">2 contra 2</button></div>
  <button class="bt" id="bBots">⚔ Contra la máquina</button>
  <button class="bt v" id="bCrear">Crear sala con amigos</button>
  <div class="fila"><input id="codigo" maxlength="6" placeholder="CÓDIGO"><button class="bt s" id="bUnir" style="min-width:0">Unirse</button></div>
  <div id="sala" class="hidden"></div>
  <div id="msg"></div>
  <button class="bt s" id="bSalir">← Volver a La Otra Comunidad</button>
</div>
<div id="hud" class="hidden">
  <div class="caja" id="yo"><img id="yoImg" alt=""><div><div id="yoNv">Nv 1</div><div id="oro">🪙 0</div><div id="kda">0 / 0 / 0</div></div></div>
  <div class="caja" id="marcador"><span class="a">0</span> · <span class="b">0</span><div id="reloj" style="font-size:11px;color:#d9c49a">0:00</div></div>
  <div class="caja" id="ping" style="font-size:11px">—</div>
</div>
<div id="barras"></div>
<div id="joy" class="hidden"><b><i></i></b></div>
<div id="mandos" class="hidden">
  <button class="hb" id="bAt"><img src="ui/b_ataque.webp" alt=""></button>
  <button class="hb" id="bQ" data-k="q"><img alt=""><span class="pip" id="pq"></span><span class="cd hidden"></span></button>
  <button class="hb" id="bW" data-k="w"><img alt=""><span class="pip" id="pw"></span><span class="cd hidden"></span></button>
  <button class="hb" id="bE" data-k="e"><img alt=""><span class="pip" id="pe"></span><span class="cd hidden"></span></button>
  <button class="hb" id="bR" data-k="r"><img alt=""><span class="pip" id="pr"></span><span class="cd hidden"></span></button>
  <button class="mas hidden" id="mq">+</button><button class="mas hidden" id="mw">+</button><button class="mas hidden" id="me">+</button><button class="mas hidden" id="mr">+</button>
  <button class="hb hs" id="bD" aria-label="Destello"><img src="../abismo/iconos/estrella.webp" alt=""><span class="cd hidden"></span></button>
  <button class="hb hs" id="bF" aria-label="Curar"><img src="../abismo/iconos/corazon.webp" alt=""><span class="cd hidden"></span></button>
</div>
<button id="bTienda" class="hidden" aria-label="Armería"></button>
<button id="bBase" class="hidden" aria-label="Volver a la base">⌂</button>
<button id="bZoom" class="hidden" aria-label="Alejar o acercar la cámara">🔍</button>
<canvas id="mini" class="hidden" width="96" height="196"></canvas>
<div id="objetivo" class="hidden"></div><div id="buffs"></div>
<div id="aviso"></div>
<div id="anuncio" class="hidden"></div>
<button id="compraRapida" class="hidden"></button>
<div id="tabla" class="hidden"></div>
<div id="muerto" class="hidden"></div>
<div id="tienda" class="hidden"></div>

<script type="module" src="juego.js"></script>
</body>
</html>
