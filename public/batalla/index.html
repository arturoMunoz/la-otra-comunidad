/* ===== menú al estilo del Wild Rift: el héroe en grande a la izquierda, modos y JUGAR a la derecha ===== */
#cargaVelo{position:fixed;inset:0;z-index:70;background:linear-gradient(#0000 55%,#000c),url(ui/carga.webp) center/cover #0c0806;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:calc(18px + var(--sab));text-shadow:0 2px 3px #000;gap:8px;color:#d9c49a;font:15px 'Alegreya Sans',system-ui,sans-serif}#cargaVelo b{color:#ffd77a;font:900 23.9px 'Cinzel',Georgia,serif}#cargaVelo .cvR{width:44px;height:44px;border-radius:50%;border:4px solid #ffd24a33;border-top-color:#ffd24a;animation:gira 0.9s linear infinite}@keyframes gira{to{transform:rotate(360deg)}}
#menu{position:fixed;inset:0;z-index:30;overflow:hidden;background:radial-gradient(ellipse at 70% 40%,#3a2611 0%,#140c06 55%,#070403 100%);color:#f2e3c0}
#menu::before{content:'';position:absolute;inset:0;background:url(ui/fondo_menu.webp) 70% center/cover;opacity:.85}#menu::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#0000 40%,#0c0806aa 62%,#0c0806dd);pointer-events:none}
#menu .mSplash{position:absolute;left:0;top:0;bottom:0;width:54%;pointer-events:none}
#menu .mSplash img{width:100%;height:100%;object-fit:cover;object-position:50% 18%;-webkit-mask-image:linear-gradient(90deg,#000 55%,transparent 98%);mask-image:linear-gradient(90deg,#000 55%,transparent 98%);animation:mEntra .6s ease-out}
@keyframes mEntra{from{opacity:0;transform:translateX(-24px)}}
#menu .mAtras{position:absolute;z-index:5;left:calc(10px + var(--sal));top:calc(10px + var(--sat));width:40px;height:40px;border-radius:50%;border:2px solid #c99a3a;background:#0c0806cc;color:#ffd77a;font-size:20px;padding:0}
#menu .mHeroe{position:absolute;z-index:2;left:calc(14px + var(--sal));bottom:calc(12px + var(--sab));display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-shadow:0 2px 6px #000}
#menu .mHeroe em{font:700 11px 'Alegreya Sans',system-ui,sans-serif;font-style:normal;letter-spacing:.14em;text-transform:uppercase;color:#1a0f06;background:#ffb02a;border-radius:4px;padding:2px 7px}
#menu .mHeroe b{font:900 22.1px 'Cinzel',Georgia,serif;color:#fff}
#menu .mHeroe button{border:1px solid #ffd77a99;background:#0c0806b0;color:#ffd77a;border-radius:16px;padding:5px 12px;font:700 13px 'Alegreya Sans',system-ui,sans-serif}
#menu .mPanel{position:absolute;z-index:2;right:calc(14px + var(--sar));top:0;bottom:0;width:min(50%,430px);display:flex;flex-direction:column;justify-content:center;align-items:stretch;gap:10px;padding:10px 0;text-align:center}
#menu .mTit h1{margin:0;font:900 34px 'Cinzel',Georgia,serif;color:#ffd77a;text-shadow:0 3px 0 #000,0 0 22px #c9852a99;letter-spacing:.06em;line-height:1}
#menu .mTit .sub{margin:4px 0 0;color:#d9c49a;font:700 12px 'Alegreya Sans',system-ui,sans-serif;letter-spacing:.32em;text-transform:uppercase}
#menu .modos{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}#menu .modos button{min-width:0}
#menu .modos button{position:relative;text-align:center;border:solid transparent;border-width:13px 15px;border-image:url(../abismo/ui/boton2.webp) 72 64 fill / 13px 15px stretch;background:none;border-radius:0;color:#f2e3c0;padding:2px 6px;min-height:66px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:0;transition:transform .12s,filter .12s;filter:brightness(.7) saturate(.75);text-shadow:0 1px 3px #000}
#menu .modos button small,#menu .modos button span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}#menu .modos button b{font:900 18px 'Cinzel',Georgia,serif;color:#ffd77a;letter-spacing:.06em;line-height:1.1}#menu .modos button span{font:700 12px 'Alegreya Sans',system-ui,sans-serif}#menu .modos button small{font:11px 'Alegreya Sans',system-ui,sans-serif;color:#b8a27a}
#menu .modos button.on{border-image-source:url(../abismo/ui/boton.webp);border-image-slice:92 100 fill;border-width:15px 20px;border-image-width:15px 20px;padding:2px 2px;filter:drop-shadow(0 0 8px #ffb02acc);transform:translateY(-2px)}
#menu .modos button.on::after{content:'';display:none}
#menu .jugar{position:relative;border:solid transparent;border-width:20px 28px;border-image:url(../abismo/ui/boton.webp) 92 100 fill / 20px 28px stretch;background:none;border-radius:0;padding:0 10px;min-height:72px;color:#ffe08a;text-shadow:0 2px 0 #1a0d04,0 0 10px #000;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:mLate 2.4s ease-in-out infinite;filter:drop-shadow(0 0 10px #ffb02a88) drop-shadow(0 4px 4px #000a)}
#menu .jugar i{position:absolute;left:4%;right:4%;bottom:-6px;height:3px;border-radius:2px;background:#0008;overflow:hidden}#menu .jugar i::after{content:'';position:absolute;left:0;top:0;bottom:0;width:var(--carga,0%);background:#ffd24a;transition:width .2s}#menu .jugar.listo i{display:none}
#menu .jugar b{font:900 28px 'Cinzel',Georgia,serif;letter-spacing:.16em;line-height:1.05}#menu .jugar small{font:700 12px 'Alegreya Sans',system-ui,sans-serif;opacity:.8;letter-spacing:.04em}
#menu .jugar:active{transform:translateY(3px) scale(.98)}
@keyframes mLate{50%{filter:drop-shadow(0 0 20px #ffb02add) drop-shadow(0 4px 4px #000a)}}
#menu .mAmigos{display:flex;gap:6px;align-items:stretch}#menu .mAmigos input{flex:1;min-width:64px;background:#0c0806d0;border:2px solid #8a6a3a;border-radius:8px;color:#ffd77a;font:800 15px 'Cinzel',Georgia,serif;letter-spacing:.2em;text-align:center;padding:4px;box-shadow:inset 0 2px 6px #000}
#menu .mB{border:solid transparent;border-width:13px 15px;border-image:url(../abismo/ui/boton2.webp) 72 64 fill / 13px 15px stretch;background:none;color:#ffd77a;border-radius:0;font:800 12px 'Cinzel',Georgia,serif;text-shadow:0 1px 3px #000;padding:2px 6px;min-height:44px;white-space:nowrap;flex-shrink:1;min-width:0;overflow:hidden;text-overflow:ellipsis;transition:transform .08s}
#menu.enSala .modos,#menu.enSala .jugar,#menu.enSala .mAmigos{display:none}
#sala{display:flex;flex-direction:column;gap:6px;background:linear-gradient(160deg,#2a1c10ee,#120b06f4);border:2px solid #8a6a3a;border-radius:14px;padding:10px 12px}
#sala .cab{display:flex;align-items:baseline;justify-content:space-between;gap:8px}#sala .cab span{font:11px 'Alegreya Sans',system-ui,sans-serif;color:#b8a27a;letter-spacing:.12em;text-transform:uppercase}
#sala .cod{font:900 30px 'Alegreya Sans',system-ui,sans-serif;letter-spacing:.25em;color:#ffd24a;text-shadow:0 0 14px #ffb02a88}

#sala .jug img{width:36px;height:36px;border-radius:8px;object-fit:cover;object-position:50% 15%}
#sala .jug.eq0{background:#0c2a4ab0;border:1px solid #3d8bff88}#sala .jug.eq1{background:#4a0c0cb0;border:1px solid #ff3b3088}#sala .jug i{color:#b8a27a;font-weight:400}

#menu #heroes{justify-content:flex-start}
#menu .heroe{width:62px}#menu .heroe img{width:46px;height:46px;object-fit:cover;object-position:50% 12%}
