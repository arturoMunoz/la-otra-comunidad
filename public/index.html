/* ---------- dibujo ---------- */
function tramoAt(k){for(var i=T.length-1;i>=0;i--) if(k>=T[i].km) return i; return 0;}
function rgb(c,f){return 'rgb('+Math.round(c[0]*f)+','+Math.round(c[1]*f)+','+Math.round(c[2]*f)+')';}
function drawTramo(i,alpha,o){
  ctx.globalAlpha=alpha;
  var top=SKY[i]||[95,155,224];
  if(OY>0){ var g=ctx.createLinearGradient(0,0,0,OY+2); g.addColorStop(0,rgb(top,.8)); g.addColorStop(1,rgb(top,1)); ctx.fillStyle=g; ctx.fillRect(0,0,W,OY+2); }
  var bottom=OY;
  TI[i].forEach(function(L){ if(!L.im) return; var w=L.im.width, x=-((o*L.v)%w); for(;x<W;x+=w) ctx.drawImage(L.im,Math.round(x),L.y+OY); bottom=Math.max(bottom,L.y+OY+L.im.height); });
  if(bottom<H){ var e=ctx.createLinearGradient(0,bottom-1,0,H); e.addColorStop(0,'#4a3320'); e.addColorStop(.35,'#33231a'); e.addColorStop(1,'#1c140d'); ctx.fillStyle=e; ctx.fillRect(0,bottom-1,W,H-bottom+1); }
  if(i<=1) VE.forEach(function(im,j){ if(!im) return; var gap=640,x=Math.round(((j*190+150-o)%gap+gap)%gap)-60; if(x<W) ctx.drawImage(im,x,OY+226-im.height+4); });
  ctx.globalAlpha=1;
}
function tint(h){
  if(h==='noche'){ctx.fillStyle='rgba(18,30,80,.36)';ctx.fillRect(0,0,W,H);}
  else if(h==='tarde'){ctx.fillStyle='rgba(230,120,60,.16)';ctx.fillRect(0,0,W,H);}
  if(weather==='lluvia'){ctx.fillStyle='rgba(70,80,95,.28)';ctx.fillRect(0,0,W,H);}
  if(weather==='calor'&&h!=='noche'){ctx.fillStyle='rgba(255,200,90,.13)';ctx.fillRect(0,0,W,H);}
}
function walker(t,h){
  var idx=h==='noche'?2:weather==='lluvia'?1:weather==='calor'?3:0, im=AR[idx]; if(!im) return;
  var x=Math.round(W*0.3), base=OY+228, step=Math.floor(t/150)%4, bob=(step%2)?-1:0;
  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(x+im.width/2,base,im.width*.38,3,0,0,Math.PI*2); ctx.fill();
  var cut=Math.round(im.height*.8);
  ctx.drawImage(im,0,0,im.width,cut,x,base-im.height+bob,im.width,cut);
  ctx.drawImage(im,0,cut,im.width,im.height-cut,x+[0,1,0,-1][step],base-im.height+cut+bob,im.width,im.height-cut);
  if(idx===2){var lx=x+im.width*.82,ly=base-im.height*.42,g=ctx.createRadialGradient(lx,ly,2,lx,ly,60);g.addColorStop(0,'rgba(255,200,100,.45)');g.addColorStop(1,'rgba(255,200,100,0)');ctx.fillStyle=g;ctx.fillRect(lx-60,ly-60,120,120);}
}
function rain(dt){
  if(weather!=='lluvia') return;
  while(drops.length<140) drops.push({x:Math.random()*W,y:Math.random()*H,s:2+Math.random()*2});
  ctx.strokeStyle='rgba(200,215,235,.55)'; ctx.lineWidth=1; ctx.beginPath();
  drops.forEach(function(d){d.y+=d.s*dt*.12; d.x-=dt*.03; if(d.y>H){d.y=-6;d.x=Math.random()*W;} ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-1.5,d.y+6);});
  ctx.stroke();
}
function stars(h){ if(h!=='noche') return; ctx.fillStyle='rgba(232,236,255,.9)'; for(var i=0;i<45;i++) ctx.fillRect((i*97)%W,(i*53)%Math.max(30,OY+40),1,1); }
function loop(now){
  var dt=Math.min(50,now-last); last=now; var h=hourNow();
  off+=dt*(reduce?0.01:0.035);
  if(me && target>km+0.001 && $('sheet').hidden){ off+=dt*0.04; setKm(km+Math.min(target-km, dt*0.0015)); }
  if(fade<1&&prevT>=0){drawTramo(prevT,1,off);drawTramo(curT,fade,off);fade=Math.min(1,fade+dt/700);} else drawTramo(curT,1,off);
  tint(h); stars(h); walker(now,h); rain(dt);
  requestAnimationFrame(loop);
}

function setKm(v){
  km=v; store.set('km',km);
  var t=tramoAt(km);
  if(t!==curT){ prevT=curT; curT=t; fade=reduce?1:0; }
  if(t>reached) reached=t;
  renderHud();
  if(km>=target-0.001) flushPending();
}
function flushPending(){
  if(!$('sheet').hidden) return;
  pending=pending.filter(function(i){return !shown.has(i) && i<=tramoAt(km);});
  if(pending.length) openArrival(pending.shift());
}
function renderHud(){
  var t=T[curT], nxt=T[curT+1], a=t.km, b=ends[curT];
  $('hudName').innerHTML=t.name+'<small>Tramo '+(curT+1)+' · '+t.cap+'</small>';
  $('hudKm').innerHTML=fmt(km)+' km<small>de '+TOTAL_KM+'</small>';
  $('nextTxt').textContent = nxt ? 'Faltan '+fmt(Math.max(0,b-km))+' km para '+nxt.name : (km>=TOTAL_KM?'Has llegado a Cricava':'Faltan '+fmt(TOTAL_KM-km)+' km para Cricava');
  $('nextBar').style.width=Math.min(100,(km-a)/(b-a)*100)+'%';
  $('steps').textContent=stepsToday.toLocaleString('es-ES');
  $('todayKm').textContent=fmt(stepsToday/STEPS_PER_KM);
  var unread=[]; for(var i=0;i<=reached;i++) if(!shown.has(i)) unread.push(i);
  $('diary').hidden=!unread.length || !$('sheet').hidden || !me;
  $('diaryTxt').textContent=unread.length===1?'Has llegado a un sitio nuevo. Tócalo para leerlo.':'Te esperan '+unread.length+' sitios nuevos. Tócalo para leerlos.';
}
$('diary').onclick=function(){ for(var i=0;i<=reached;i++) if(!shown.has(i)){ openArrival(i); return; } };

/* ---------- Libro Rojo: la página se escribe según andas el tramo ---------- */
function frases(i){ return T[i].text.match(/[^.!?]+[.!?»]+/g) || [T[i].text]; }
function leidas(i){
  var n=frases(i).length, cur=tramoAt(km);
  if(i<cur || km>=TOTAL_KM) return n;
  if(i>cur) return 0;
  var p=(km-T[i].km)/(ends[i]-T[i].km);
  return Math.max(1, Math.min(n, 1+Math.floor(p*n)));
}
function pageHtml(i){
  var f=frases(i), k=leidas(i);
  return f.map(function(s,j){ return j<k ? s : '<span class="hid">'+s+'</span>'; }).join(' ');
}

/* ---------- hojas ---------- */
var sheet=$('sheet'), veil=$('veil');
function openSheet(html){ sheet.innerHTML='<div class="grab"></div>'+html; sheet.hidden=false; veil.hidden=false; $('diary').hidden=true; sheet.scrollTop=0; }
function closeSheet(){ sheet.hidden=true; veil.hidden=true; renderHud(); setTimeout(flushPending,400); }
veil.onclick=closeSheet;
function mark(i){ if(!shown.has(i)){ shown.add(i); if(me) rpc('loc_leer',{p_tramo:i}).catch(function(){}); } }
function openArrival(i){
  mark(i); var s=T[i];
  openSheet('<span class="eyebrow">Has llegado · Tramo '+(i+1)+' · '+s.cap+'</span><h2>'+s.title+'</h2>'+
    '<p class="page">'+pageHtml(i)+'</p>'+
    '<div class="bubble">'+ICON[s.icon]+'<div><b>'+s.who+'</b><i>'+s.say+'</i></div></div>'+
    '<p class="note">El resto de la página se escribe en tu Libro Rojo mientras caminas. Al zurrón: <b>'+ITEMS[i].n+'</b>.</p>'+
    (s.mini?'<span class="mini">'+s.mini+' · próximamente</span>':'')+
    '<button class="primary" id="shOk" type="button">Seguir andando</button>');
  $('shOk').onclick=closeSheet;
}
function openPage(i){
  var s=T[i], k=leidas(i), n=frases(i).length;
  openSheet('<button class="back" id="bk" type="button">‹ Libro Rojo</button><span class="eyebrow">Página '+(i+1)+' · '+s.cap+' · km '+s.km+'–'+ends[i]+'</span><h2>'+s.title+'</h2>'+
    '<p class="page">'+pageHtml(i)+'</p>'+
    (k<n?'<p class="note">Faltan '+fmt(Math.max(0,ends[i]-km))+' km de este tramo para leer la página entera.</p>':'')+
    '<div class="bubble">'+ICON[s.icon]+'<div><b>'+s.who+'</b><i>'+s.say+'</i></div></div>');
  $('bk').onclick=function(){ openTab('libro'); };
}
function faceStyle(h,size){ return 'background-image:url('+M.faces+');background-size:'+(size*7)+'px '+size+'px;background-position:-'+((FACE[h]||0)*size)+'px 0'; }
var TABS={
  libro:function(){return '<h2>Libro Rojo</h2><p class="note">Cada tramo escribe su página mientras lo recorres.</p><ol class="list">'+T.map(function(s,i){var o=i<=reached, k=leidas(i), n=frases(i).length;return '<li class="'+(o?'':'locked')+'"><span class="n">'+(i+1)+'</span><span class="t">'+(o?'<button type="button" data-page="'+i+'">'+s.title+'</button>':'Página en blanco')+'</span><span class="k">'+(o?(k<n?'escribiéndose':'completa'):'km '+s.km)+'</span></li>';}).join('')+'</ol>';},
  comunidad:function(){var l=people.slice().sort(function(a,b){return b.pasos_totales-a.pasos_totales;});
    return '<h2>La Comunidad</h2><ol class="list people">'+l.map(function(p){var mine=me&&p.nombre===me.nombre, k=mine?km:Math.min(TOTAL_KM,Number(p.pasos_totales)/STEPS_PER_KM);return '<li class="'+(mine?'me':'')+'"><span class="face" style="'+faceStyle(p.hobbit,36)+'"></span><span class="t">'+p.nombre+'</span><span class="k">'+fmt(k)+' km<br>'+T[tramoAt(k)].name+'</span></li>';}).join('')+'</ol>'+
    '<div class="bubble">'+ICON.balsa+'<div><b>Tu clave del atajo</b><i>Solo hace falta una vez, al instalar el atajo del iPhone. No se la pases a nadie.</i></div></div>'+
    '<button class="ghost" type="button" id="copyKey">Copiar mi clave del atajo</button>'+
    '<button class="ghost" type="button" id="logout">Salir ('+(me?me.nombre:'')+')</button>';},
  zurron:function(){var got=ITEMS.filter(function(_,i){return i<=reached;}).length;
    return '<h2>Zurrón</h2><p class="note">'+got+' de '+ITEMS.length+' objetos del camino. Cada sitio nuevo te deja uno.</p><div class="bag">'+ITEMS.map(function(it,i){var o=i<=reached;return '<div class="item'+(o?'':' no')+'"><div class="box">'+ICON[it.i]+'</div>'+(o?it.n:'¿?')+'</div>';}).join('')+'</div>';}
};
function bindSheet(){
  sheet.querySelectorAll('[data-page]').forEach(function(x){x.onclick=function(){openPage(+x.dataset.page);};});
  var lo=$('logout'); if(lo) lo.onclick=logout;
  var ck=$('copyKey'); if(ck) ck.onclick=function(){ var k=String(me&&me.clave_atajo||'');
    var done=function(){ ck.textContent='Copiada'; setTimeout(function(){ck.textContent='Copiar mi clave del atajo';},1600); };
    if(navigator.clipboard) navigator.clipboard.writeText(k).then(done).catch(function(){ ck.textContent=k; }); else ck.textContent=k; };
}
function openTab(tab){
  openSheet(TABS[tab]()); bindSheet();
  if(tab==='comunidad') refresh().then(function(){ if(!sheet.hidden && $('logout')){ sheet.innerHTML='<div class="grab"></div>'+TABS.comunidad(); bindSheet(); } });
}
document.querySelectorAll('.btns button').forEach(function(b){ b.onclick=function(){ openTab(b.dataset.tab); }; });
</script>
</body>
