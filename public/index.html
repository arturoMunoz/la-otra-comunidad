var T = [
  {km:0, name:"Bolsón Cerrado", title:"Frodo deja Bolsón Cerrado", cap:"Cap. 3",
   text:"Frodo ha vendido Bolsón Cerrado a sus parientes, los Sacovilla-Bolsón, y cuenta a todo el mundo que se muda a Cricava, al otro lado del río. Es una excusa. El anillo que le dejó Bilbo al marcharse es el Anillo Único, el que forjó el Señor Oscuro, y su dueño ha despertado y lo busca. El mago le avisó en primavera de que tendría que irse, y prometió volver para acompañarle. Pero el verano pasa, llega el otoño y el mago no aparece. Frodo cumple cincuenta años, recoge sus cosas y prepara la marcha. La última noche, mientras los nuevos dueños llaman a la puerta principal, él sale por la de atrás con Sam y Pippin, con el zurrón a la espalda y el Anillo en el bolsillo.",
   who:"Gandalf", icon:"cohete", say:"«Vete en cuanto puedas. Y no lo uses.»", mini:"Minijuego: Hacer el zurrón"},
  {km:5, name:"Camino de Delagua", title:"La Comarca dormida", cap:"Cap. 3",
   text:"Los tres hobbits echan a andar de noche, sin prisa, por los caminos que conocen desde siempre. Dejan atrás el molino, el estanque y las luces de Delagua, donde la gente aún se sienta en la posada a comentar las rarezas de los Bolsón. Allí se recuerda la famosa fiesta de Bilbo y cómo desapareció delante de todos en mitad de su discurso. Nadie entiende por qué Frodo vende una casa tan buena para irse a vivir con los de la otra orilla. Frodo camina callado: es la primera vez que sale de casa sabiendo que quizá no vuelva. Sam, en cambio, no deja de mirar a todos lados: siempre quiso ver elfos, y siente que este viaje le va a llevar mucho más lejos que Cricava.",
   who:"Un vecino de Delagua", icon:"pipa", say:"«¿El señor Bolsón, a vivir con los de la otra orilla? Qué cosa más rara.»", mini:""},
  {km:15, name:"Colinas Verdes", title:"Un jinete en el camino", cap:"Cap. 3",
   text:"Al segundo día, en las Colinas Verdes, oyen cascos de caballo detrás de ellos. Frodo tiene un mal presentimiento y manda a todos esconderse bajo las raíces de un árbol junto al camino. Llega un jinete alto, envuelto en una capa negra, sobre un caballo también negro. Se detiene justo al lado del escondite y se inclina, como si olfateara el aire buscando algo. Frodo siente unas ganas enormes, casi irresistibles, de ponerse el Anillo. Su mano ya está en el bolsillo cuando el jinete se incorpora y se aleja despacio. Ninguno sabe qué era aquello, pero Sam lo tiene claro: no era un hombre como los demás, y lo que buscaba era a Frodo.",
   who:"Sam", icon:"hoja", say:"«Señor Frodo, eso no era un hobbit.»", mini:"Minijuego: Quieto bajo el árbol"},
  {km:35, name:"Bosque Cerrado", title:"Noche con los elfos", cap:"Cap. 3",
   text:"Al caer la noche el jinete vuelve a acercarse por el camino del bosque. Esta vez les salva una canción: un grupo de elfos que viaja hacia el oeste pasa por allí cantando a la luz de las estrellas, y la sombra negra se retira. Los elfos reconocen a Frodo como sobrino de Bilbo y les invitan a compartir su cena en un claro del bosque. Sam está tan feliz que casi no puede hablar. Frodo habla largo rato con su jefe, que no le cuenta todo lo que sabe, pero le advierte de que los jinetes son enemigos muy peligrosos y le aconseja no viajar solo. Esa noche duermen bajo los árboles, protegidos por primera vez desde que salieron de casa.",
   who:"Gildor, el elfo", icon:"estrella", say:"«Los caminos ya no son seguros. No vayas solo.»", mini:""},
  {km:55, name:"Atajo campo a través", title:"El atajo", cap:"Cap. 4",
   text:"A la mañana siguiente los elfos ya se han ido. Para no volver a la calzada, donde el jinete podría esperarles, Frodo decide ir campo a través en línea recta hacia la Balsadera. Parece un atajo, pero el terreno se complica enseguida: zanjas, matorrales espinosos, setos imposibles de cruzar y un arroyo detrás de otro. Se mojan, se arañan y se pierden más de una vez. Encima empieza a llover. Pippin protesta, Sam calla y carga con todo, y Frodo empieza a entender que el camino largo a veces es el más corto. Por la tarde, cansados y embarrados, ven a lo lejos los campos de una granja que Frodo conoce demasiado bien.",
   who:"Pippin", icon:"hoja", say:"«¿Seguro que esto era más corto?»", mini:""},
  {km:75, name:"La granja", title:"Las setas del granjero", cap:"Cap. 4",
   text:"Son las tierras del granjero Maggot. De niño, Frodo le robaba setas y el granjero le echaba encima a sus perros, así que ahora le da miedo hasta acercarse. Pero Maggot les recibe con amabilidad. Les cuenta que esa misma tarde un jinete negro se ha presentado en su puerta preguntando por un tal «Bolsón», con una voz extraña que le puso los pelos de punta, y que él lo echó de sus tierras. Les da de cenar, les ofrece cerveza y, al despedirse, su mujer les regala una cesta llena de setas. Frodo se avergüenza de haberle tenido miedo tantos años: a veces quien parece peligroso resulta ser el mejor aliado.",
   who:"El granjero Maggot", icon:"cesta", say:"«En mis tierras no quiero jinetes de esos.»", mini:"Minijuego: Setas a escondidas"},
  {km:90, name:"Calzada hacia el río", title:"Cascos en la niebla", cap:"Cap. 4-5",
   text:"Para que no vayan solos de noche, el granjero Maggot los lleva en su carro por la calzada que sigue el río. Cae una niebla espesa y el carro avanza despacio entre los álamos. De pronto se oyen cascos que se acercan por detrás, y los hobbits se encogen pensando que el jinete ha vuelto. La figura que sale de la niebla les da un susto de muerte… pero es Merry, su amigo, que llevaba horas esperándoles en la Balsadera y había salido a buscarles con su poni. Se despiden de Maggot, que se va a casa con su cesta vacía y muchas preguntas, y los cuatro hobbits siguen juntos hacia el río.",
   who:"Merry", icon:"casa", say:"«¡Por fin! Llevaba toda la tarde esperándoos.»", mini:""},
  {km:110, name:"Balsadera y Cricava", title:"Una conspiración desenmascarada", cap:"Cap. 5",
   text:"Cruzan el río en la vieja balsa empujando con pértigas. Cuando ya están en la otra orilla, una figura negra llega al embarcadero que acaban de dejar y se queda allí, mirando el agua, sin poder seguirles. En la casa de Cricava les espera un baño caliente y una buena cena. Pero cuando Frodo intenta despedirse para seguir solo, sus amigos le sorprenden: lo saben todo. Saben lo del Anillo, saben que se va y saben que es peligroso. Sam les ha ido contando lo que oía, y llevan meses preparándose en secreto. No piensan dejarle marchar solo. Frodo, emocionado, acepta: ya no es un hobbit huyendo, es una pequeña comunidad.",
   who:"Merry", icon:"balsa", say:"«Somos tus amigos. Vamos contigo.»", mini:"Minijuego: La balsa · Fin de la fase 1"}
];

    .then(function(r){return r.json();}).then(function(j){
      var c=j.current, w=c.weather_code; temp=Math.round(c.temperature_2m); isDay=!!c.is_day;
      var wet=(w>=51&&w<=67)||(w>=71&&w<=86)||w>=95;

function showWx(){

function hourNow(){
  var h=new Date().getHours();

  if(h>=7&&h<9) return 'tarde';
  if(h>=9&&h<18) return 'dia';
  if(h>=18&&h<21) return 'tarde';
  return isDay===true ? 'tarde' : 'noche';
}

  if(WALK){
    var n=M.andar.n, fw=M.andar.fw, fh=WALK.height, f=Math.floor(t/(reduce?400:(M.andar.ms||200)))%n, wx=Math.round(W*0.3)+((M.andar.dx&&M.andar.dx[f])||0), wb=OY+228;
    ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(wx+fw/2,wb,fw*.38,3,0,0,Math.PI*2); ctx.fill();
    if(typeof dibujaEquipo==='function') dibujaEquipo(ctx,wx,wb-fh,f,true);
    ctx.drawImage(WALK,Math.round(f*fw),0,Math.round(fw),fh,wx,wb-fh,Math.round(fw),fh);
    if(typeof dibujaEquipo==='function') dibujaEquipo(ctx,wx,wb-fh,f,false);

      var A=(typeof anclas==='function')?anclas():null, a0=A?A[f%A.length]:{cx:fw/2,top:0};
      var lx=wx+Math.min(fw-4,a0.cx+16), ly=wb-fh+fh*0.5;

      if(fi&&fi.complete){ ctx.drawImage(fi,Math.round(lx-6),Math.round(ly-6+(f%2)),12,Math.round(12*fi.height/fi.width)); }
    }

  }
  var im=AR[idx]; if(!im) return;

  ctx.fillStyle='rgba(0,0,0,.22)'; ctx.beginPath(); ctx.ellipse(x+im.width/2,base,im.width*.38,3,0,0,Math.PI*2); ctx.fill();

  ctx.strokeStyle='rgba(200,215,235,.55)'; ctx.lineWidth=1; ctx.beginPath();

function rutaPunto(k){
  var Lg=M.mapa.lugares, r=M.mapa.ruta, y;
  k=Math.max(0,Math.min(Lg[Lg.length-1][0],k));
  for(var i=0;i<Lg.length-1;i++){ if(k<=Lg[i+1][0]){ var t=(k-Lg[i][0])/(Lg[i+1][0]-Lg[i][0]); y=Lg[i][2]+(Lg[i+1][2]-Lg[i][2])*t; break; } }
  if(y==null) y=Lg[Lg.length-1][2];
  for(var j=0;j<r.length-1;j++){ var a=r[j],b=r[j+1]; if((a[1]-y)*(b[1]-y)<=0){ var u=a[1]===b[1]?0:(y-a[1])/(b[1]-a[1]); return [a[0]+(b[0]-a[0])*u, y, j]; } }
  return [r[r.length-1][0], y, r.length-1];
}

/* ---------- 1 · HACER EL ZURRÓN (tramo 1) ---------- */
function jugarZurron(el,cerrar){
  var CAP=8, DUR=30;
  function intro(){
    el.innerHTML='<div class="hd"><h2>Hacer el zurrón</h2><button class="x" type="button" aria-label="Cerrar">×</button></div>'+
      '<div class="intro"><p>Frodo se va mañana y el zurrón solo tiene <b>'+CAP+' huecos</b>. Por la mesa van pasando cosas de Bolsón Cerrado: <b>toca las que sirven para el camino</b> y deja pasar las demás.</p>'+
      '<div class="ex"><div>'+mjIcon('pan')+'Pan</div><div>'+mjIcon('cuerda')+'Cuerda</div><div>'+mjIcon('farol')+'Farol</div><div class="no">'+mjIcon('sillon')+'Sillón</div><div class="no">'+mjIcon('reloj')+'Reloj</div></div>'+
      '<p class="note">Acierto +1 · cosa inútil −1 · '+DUR+' segundos. '+(mjBest('zurron')?'Tu mejor resultado: '+mjStars(mjBest('zurron')):'')+'</p>'+
      '<button class="go" type="button" id="mjGo">Empezar</button></div>';
    el.querySelector('.x').onclick=cerrar; el.querySelector('#mjGo').onclick=jugar;
  }
  function jugar(){
    el.innerHTML='<div class="hd"><h2>Hacer el zurrón</h2><div class="stat"><span id="mjT">'+DUR+'</span><span id="mjP">0</span></div></div>'+
      '<div class="field" id="mjF"><div class="table"></div><div class="msg" id="mjM"></div><div class="bag">'+BAG_SVG+'<div class="slots" id="mjS"></div></div></div>';
    var F=el.querySelector('#mjF'), S=el.querySelector('#mjS'), M=el.querySelector('#mjM');
    try{ F.style.background='url('+cv.toDataURL()+') center 30%/cover no-repeat, #a8763a'; }catch(e){}
    for(var i=0;i<CAP;i++) S.appendChild(document.createElement('i'));
    var pts=0, packed=[], live=[], t0=performance.now(), lastSpawn=-9, raf=0, done=false, msgT=0;
    /* baraja: 60 % útiles, sin repetir la misma cosa seguida */
    var deck=[], prev=null;
    function next(){ var pool=ZURRON_ITEMS.filter(function(x){return x!==prev;}); var useful=Math.random()<.6;
      var c=pool.filter(function(x){return x.ok===useful;}); prev=c[Math.floor(Math.random()*c.length)]; return prev; }
    function say(t,bad){ M.textContent=t; M.className='msg on'+(bad?' bad':''); clearTimeout(msgT); msgT=setTimeout(function(){M.className='msg';},1600); }
    function spawn(){
      var it=next(), b=document.createElement('button'); b.type='button'; b.className='it';
      b.innerHTML=mjIcon(it)+it.n; F.appendChild(b);
      var o={el:b,it:it,x:F.clientWidth+50,v:(F.clientWidth+100)/(2.9-Math.min(1.2,(performance.now()-t0)/30000*1.2))};
      b.style.left=o.x+'px';
      b.onpointerdown=function(e){ e.preventDefault(); if(done||o.gone) return; o.gone=true; b.classList.add('fly');
        setTimeout(function(){b.remove();},380);
        if(it.ok){ pts++; packed.push(it); say('¡'+it.n+' al zurrón!'); }
        else { pts=Math.max(0,pts-1); say(it.q,true); }
        S.querySelectorAll('i').forEach(function(d,j){ d.className=j<packed.length?'on':''; });
        el.querySelector('#mjP').textContent=pts;
        if(packed.length>=CAP) fin();
      };
      live.push(o);
    }
    var last=performance.now();
    function tick(now){
      var dt=(now-last)/1000; last=now; var t=(now-t0)/1000;
      el.querySelector('#mjT').textContent=Math.max(0,Math.ceil(DUR-t));
      var gap=1.25-Math.min(.5,t/DUR*.5);
      if(t-lastSpawn>gap){ spawn(); lastSpawn=t; }
      live=live.filter(function(o){ if(o.gone) return false; o.x-=o.v*dt; o.el.style.left=o.x+'px'; if(o.x<-60){ o.el.remove(); return false; } return true; });
      if(t>=DUR) return fin();
      raf=requestAnimationFrame(tick);
    }
    function fin(){
      if(done) return; done=true; cancelAnimationFrame(raf);
      var st=pts>=7?3:pts>=5?2:pts>=3?1:0; mjSaveBest('zurron',st);
      var frase=['El zurrón va más vacío que una despensa después de la fiesta.','Algo es algo: no os moriréis de hambre el primer día.','Buen zurrón. Sam estaría orgulloso.','Zurrón perfecto: ni Bilbo lo habría hecho mejor.'][st];
      el.innerHTML='<div class="hd"><h2>Hacer el zurrón</h2><button class="x" type="button" aria-label="Cerrar">×</button></div>'+
        '<div class="end"><div class="stars" aria-label="'+st+' de 3 estrellas">'+mjStars(st)+'</div><p><b>'+pts+' puntos.</b> '+frase+'</p>'+
        (packed.length?'<div class="got">'+packed.map(mjIcon).join('')+'</div>':'')+
        '<p class="note">Mejor resultado: '+mjStars(mjBest('zurron'))+'. Lo que da cada estrella está por decidir.</p>'+
        '<div class="row2"><button class="ghost" type="button" id="mjR">Otra vez</button><button class="go" type="button" id="mjOk">Seguir andando</button></div></div>';
      el.querySelector('.x').onclick=cerrar; el.querySelector('#mjOk').onclick=cerrar; el.querySelector('#mjR').onclick=jugar;
    }
    el._stop=function(){ done=true; cancelAnimationFrame(raf); };
    raf=requestAnimationFrame(tick);
  }
  intro();
}

    var sus=0, maxSus=0, holding=false, sx=0, sy=0, t0=performance.now(), last=t0, raf=0, done=false, wT=0;
    var FR=['Póntelo… nadie te verá','Suelta… será solo un momento','Él no puede encontrarte si te lo pones','¿Por qué esconderse? Póntelo'];
    H.onpointerdown=function(e){ e.preventDefault(); holding=true; sx=e.clientX; sy=e.clientY; H.classList.add('on'); try{H.setPointerCapture(e.pointerId);}catch(_){} };
    H.onpointermove=function(e){ if(holding && Math.hypot(e.clientX-sx,e.clientY-sy)>18){ sus+=6; sx=e.clientX; sy=e.clientY; } };
    var up=function(){ holding=false; H.classList.remove('on'); };
    H.onpointerup=up; H.onpointercancel=up; H.onlostpointercapture=up;
    function tick(now){
      var dt=(now-last)/1000; last=now; var t=(now-t0)/1000, p=t/DUR;
      var x=-0.2+1.4*p; J.style.left=(x*100)+'%';
      var ji=el.querySelector('#mjJi'); if(ji&&M.mj.jinete2) ji.src=(Math.floor(t*2.2)%2&&near>0.3)?M.mj.jinete2:M.mj.jinete1;
      var near=Math.max(0,1-Math.abs(x-0.5)*2.2);       /* 1 cuando el jinete está encima */
      if(!holding) sus+=dt*(18+60*near); else sus=Math.max(0,sus-dt*4);
      sus=Math.min(100,sus); maxSus=Math.max(maxSus,sus); B.style.width=sus+'%';
      D.style.opacity=(0.25+0.6*near).toFixed(2);
      if(now-wT>2600 && near>0.2){ wT=now; Wh.innerHTML=(M.mj&&M.mj.anillo?'<img src="'+M.mj.anillo+'" alt="" style="width:40px;height:40px;display:block;margin:0 auto 4px;image-rendering:pixelated">':'')+FR[Math.floor(Math.random()*FR.length)]; Wh.classList.add('on'); setTimeout(function(){Wh.classList.remove('on');},1500); }
      el.querySelector('#mjT').textContent=Math.max(0,Math.ceil(DUR-t));
      if(sus>=100) return fin(true);
      if(t>=DUR) return fin(false);
      raf=requestAnimationFrame(tick);
    }
    function fin(visto){
      if(done) return; done=true; cancelAnimationFrame(raf);
      var st=visto?0:maxSus<30?3:maxSus<60?2:1;
      var txt=visto?'<b>El jinete os ha visto.</b> Frodo tiene que salir corriendo campo a través.':['','Se ha ido… por los pelos.','Se ha ido sin veros. Sam respira.','Ni una hoja se ha movido. El jinete se pierde en la noche.'][st];
      mjFin(el,ID,TIT,st,txt,jugar,cerrar);
    }
    el._stop=function(){ done=true; cancelAnimationFrame(raf); };
    raf=requestAnimationFrame(tick);
  }
  intro();
}

/* ---------- 3 · SETAS A ESCONDIDAS (tramo 6) ----------
   Topo clásico: toca las setas que asoman, nunca a los perros del granjero. */
function jugarSetas(el,cerrar){
  var ID='setas', TIT='Setas a escondidas', DUR=30;
  function intro(){ mjIntro(el,ID,TIT,'<p>En los campos del granjero asoman setas. <b>Tócalas antes de que se escondan</b>, pero cuidado: a veces asoma uno de sus perros. <b>Si tocas un perro, pierdes 2 setas.</b></p><div class="ex"><div>'+mjImg('seta1',SVG_SETA)+'Seta +1</div><div class="no">'+mjImg('perro1',SVG_PERRO)+'Perro −2</div></div>',jugar,cerrar); }
  function jugar(){
    el.innerHTML=mjCabecera(TIT,'<div class="stat"><span id="mjT">'+DUR+'</span><span id="mjP">0</span></div>')+'<div class="field" id="mjF"><div class="msg" id="mjM"></div><div class="grid" id="mjG"></div></div>';
    var F=el.querySelector('#mjF'), G=el.querySelector('#mjG'), Msg=el.querySelector('#mjM'); mjFondo(F);
    var holes=[]; for(var i=0;i<9;i++){ var h=document.createElement('div'); h.className='hole'; if(M.mj&&M.mj.hoyo){ h.style.background='url('+M.mj.hoyo+') center 85%/100% auto no-repeat'; } G.appendChild(h); holes.push({el:h,busy:false}); }
    var pts=0, t0=performance.now(), raf=0, done=false, lastPop=-9, mT=0;
    function say(t,bad){ Msg.textContent=t; Msg.className='msg on'+(bad?' bad':''); clearTimeout(mT); mT=setTimeout(function(){Msg.className='msg';},1100); }
    function pop(t){
      var free=holes.filter(function(h){return !h.busy;}); if(!free.length) return;
      var h=free[Math.floor(Math.random()*free.length)], dog=Math.random()<0.25+0.1*(t/DUR);
      var b=document.createElement('button'); b.type='button'; b.className='pop'; b.innerHTML=dog?mjImg('perro'+(1+Math.floor(Math.random()*3)),SVG_PERRO):mjImg('seta'+(1+Math.floor(Math.random()*3)),SVG_SETA); b.setAttribute('aria-label',dog?'Perro':'Seta');
      h.el.appendChild(b); h.busy=true; requestAnimationFrame(function(){ b.classList.add('up'); });
      var life=1100-500*(t/DUR), gone=false;
      var quit=function(){ if(gone) return; gone=true; b.classList.remove('up'); setTimeout(function(){ b.remove(); h.busy=false; },160); };
      b.onpointerdown=function(e){ e.preventDefault(); if(done||gone) return;
        if(dog){ pts=Math.max(0,pts-2); say('¡Guau! El perro te ha olido. −2',true); } else { pts++; }
        el.querySelector('#mjP').textContent=pts; quit(); };
      setTimeout(quit,life);
    }
    function tick(now){
      var t=(now-t0)/1000; el.querySelector('#mjT').textContent=Math.max(0,Math.ceil(DUR-t));
      if(t-lastPop>0.75-0.35*(t/DUR)){ pop(t); lastPop=t; }
      if(t>=DUR) return fin();
      raf=requestAnimationFrame(tick);
    }
    function fin(){ if(done) return; done=true; cancelAnimationFrame(raf);
      var st=pts>=18?3:pts>=12?2:pts>=6?1:0;
      mjFin(el,ID,TIT,st,'<b>'+pts+' setas.</b> '+['Los perros te han dado más guerra que las setas.','Para una tortilla pequeña da.','Buena cesta. El granjero ni se ha enterado.','Cesta llena. Como cuando Frodo era pequeño.'][st],jugar,cerrar); }
    el._stop=function(){ done=true; cancelAnimationFrame(raf); };
    raf=requestAnimationFrame(tick);
  }
  intro();
}

/* ---------- 4 · LA BALSA (tramo 8) ----------
   Toca «Empujar» cuando la marca pase por la zona verde. Llega a la otra orilla antes de que la sombra llegue al embarcadero. */
function jugarBalsa(el,cerrar){
  var ID='balsa', TIT='La balsa', DUR=20;
  function intro(){ mjIntro(el,ID,TIT,'<p>Una sombra se acerca al embarcadero. Cruzad el río en la balsa: <b>pulsa «Empujar» justo cuando la marca pase por la zona verde</b>. Si fallas, la balsa apenas avanza.</p><p>Tienes que llegar a la otra orilla antes de que la sombra llegue al agua.</p>',jugar,cerrar); }
  function jugar(){
    el.innerHTML=mjCabecera(TIT,'<div class="stat"><span id="mjT">'+DUR+'</span></div>')+
      '<div class="field" id="mjF"><div class="river"'+(M.mj&&M.mj.rio?' style="background:url('+M.mj.rio+') center/auto 100% repeat-x"':'')+'></div><div class="shore" style="left:0">'+mjImg('muelle')+'</div><div class="shore" style="right:0">'+mjImg('juncos')+'</div><div class="shadow" id="mjS">'+mjImg('sombra')+'</div><div class="raft" id="mjR">'+mjImg('balsa1')+'</div><div class="msg" id="mjM"></div>'+
      '<div class="rhythm"><div class="z" id="mjZ"></div><div class="k" id="mjK"></div></div><button class="push" id="mjP" type="button">Empujar</button></div>';
    var F=el.querySelector('#mjF'), R=el.querySelector('#mjR'), S=el.querySelector('#mjS'), K=el.querySelector('#mjK'), Z=el.querySelector('#mjZ'), Msg=el.querySelector('#mjM');
    var prog=0, t0=performance.now(), raf=0, done=false, zone=[0.4,0.6], mT=0, pos=0;
    function newZone(){ var w=0.2-0.08*Math.min(1,prog); var a=0.15+Math.random()*(0.7-w); zone=[a,a+w]; Z.style.left=(a*100)+'%'; Z.style.width=(w*100)+'%'; }
    function say(t,bad){ Msg.textContent=t; Msg.className='msg on'+(bad?' bad':''); clearTimeout(mT); mT=setTimeout(function(){Msg.className='msg';},800); }
    newZone();
    el.querySelector('#mjP').onpointerdown=function(e){ e.preventDefault(); if(done) return;
      var ri=R.querySelector('img'); if(ri&&M.mj.balsa2){ ri.src=M.mj.balsa2; setTimeout(function(){ ri.src=M.mj.balsa1; },350); }
      if(pos>=zone[0]&&pos<=zone[1]){ prog+=0.11; say('¡Buen empujón!'); } else { prog+=0.02; say('Casi…',true); }
      newZone(); if(prog>=1) fin(true); };
    function tick(now){
      var t=(now-t0)/1000; pos=(Math.sin(t*(2.6+1.2*Math.min(1,prog)))+1)/2;
      K.style.left=(pos*100)+'%'; R.style.left=(16+68*Math.min(1,prog)+5)+'%';
      S.style.left=(4+12*Math.min(1,t/DUR))+'%';
      el.querySelector('#mjT').textContent=Math.max(0,Math.ceil(DUR-t));
      if(t>=DUR) return fin(false);
      raf=requestAnimationFrame(tick);
    }
    function fin(ok){ if(done) return; done=true; cancelAnimationFrame(raf);
      var left=Math.max(0,DUR-(performance.now()-t0)/1000);
      var st=!ok?0:left>8?3:left>4?2:1;
      mjFin(el,ID,TIT,st,ok?(st===3?'Habéis cruzado de sobra: la sombra se queda mirando desde la otra orilla.':'Habéis cruzado. La sombra llega al embarcadero demasiado tarde.'):'<b>La sombra ha llegado al agua</b> antes de que llegarais a la orilla. Menos mal que no sabe nadar.',jugar,cerrar); }
    el._stop=function(){ done=true; cancelAnimationFrame(raf); };
    raf=requestAnimationFrame(tick);
  }
  intro();
}

/* ================= DECISIONES DEL ZURRÓN (sustituye al minijuego del tramo 1) =================

var ZDEC={

    o:[{l:'Dejarle hacer',d:'Sam sabe lo que hace.',add:['sarten','pan'],set:{samFeliz:1},go:'bilbo'},
       {l:'Sacar los cazos y meter la manta',d:'A Sam no le va a hacer gracia.',add:['manta'],set:{samEnfadado:1},go:'bilbo'},
       {l:'Sacar los cazos y meter el farol',d:'A Sam no le va a hacer gracia.',add:['farol'],set:{samEnfadado:1},go:'bilbo'}]},
  bilbo:{t:'Bilbo dejó algo en la repisa',p:'Antes de cerrar la puerta redonda ves tres cosas que Bilbo no se llevó. Solo te da tiempo a coger una.',
    o:[{l:'Su mapa de la Comarca',d:'Lleno de notas a lápiz.',add:['mapa'],go:null},

};
var ZNOM={manta:'Manta',farol:'Farol',cuerda:'Cuerda',sarten:'Sartén',pan:'Pan y queso',capa:'Capa de lluvia',mapa:'Mapa de Bilbo',panuelo:'Pañuelos de Bilbo',cantimplora:'Cantimplora'};
var ZICO={manta:'manta',farol:'farol',cuerda:'cuerda',sarten:'cucharas',pan:'pan',capa:'paraguas',mapa:'mapa',panuelo:'libraco',cantimplora:'cantimplora'};

var ZMOM={
  3:{need:['manta'],ok:'Dormís al raso con los elfos. Gracias a la manta, pasas la noche caliente.',ko:'Dormís al raso con los elfos. Sin manta, tiritas hasta el amanecer.'},
  4:{need:['mapa'],ok:'Con el mapa de Bilbo encontráis los pasos buenos de las zanjas.',ko:'Sin mapa, os metéis en todas las zarzas del atajo.'},
  5:{need:['sarten'],ok:'Con la sartén de Sam, las setas del granjero acaban en una cena de reyes.',ko:'Tenéis setas, pero nada en qué cocinarlas.'},

};
function zEstado(){ return store.get('zurron',null); }
function zTiene(k){ var z=zEstado(); return !!(z&&z.items.indexOf(k)>=0); }
function zMomentoHtml(i){
  var m=ZMOM[i], z=zEstado(); if(!m||!z) return '';
  var ok=m.need.some(zTiene);
  return '<div class="bubble">'+mjIcon(ZICO[m.need[0]])+'<div><b>'+(ok?'Tu zurrón te ha salvado':'Te faltó algo en el zurrón')+'</b><i>'+(ok?m.ok:m.ko)+'</i></div></div>';
}
function zPuntos(){
  var z=zEstado(); if(!z) return {p:0,tot:5,acier:[]};
  var acier=Object.keys(ZMOM).filter(function(i){ return ZMOM[i].need.some(zTiene); });
  var p=acier.length+(z.flags.samFeliz?1:0)-(z.flags.samEnfadado?1:0)-(z.flags.pesado?1:0)+(z.flags.ligero?1:0);
  return {p:Math.max(0,p),acier:acier};
}
function zSello(){ var p=zPuntos().p; return p>=4?{n:'oro',t:'Sello de oro del Acto I',c:'#d4a531'}:p>=2?{n:'plata',t:'Sello de plata del Acto I',c:'#b8bfc6'}:{n:'bronce',t:'Sello de bronce del Acto I',c:'#b07a43'}; }
function zTitulo(){ var z=zEstado()||{flags:{},items:[]};
  if(z.flags.samFeliz) return 'El que hizo caso a Sam';
  if(z.flags.samEnfadado) return 'El que discutió con Sam';
  if(z.flags.ligero) return 'Pies ligeros';
  return 'El previsor'; }

function jugarDecisiones(el,cerrar){
  var path=[], items=[], flags={};
  function pinta(id){
    var n=ZDEC[id];
    el.innerHTML=mjCabecera('Hacer el zurrón')+'<div class="intro"><span class="eyebrow">Decisión '+(path.length+1)+' de 3</span><h2 style="font-size:1.2rem">'+n.t+'</h2><p>'+n.p+'</p>'+
      (items.length?'<div class="got">'+items.map(function(k){return mjIcon(ZICO[k]);}).join('')+'</div>':'')+
      '<div class="opts">'+n.o.map(function(o,i){return '<button class="opt" type="button" data-i="'+i+'"><b>'+o.l+'</b><span>'+o.d+'</span></button>';}).join('')+'</div></div>';
    el.querySelector('.x').onclick=cerrar;
    el.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){
      var o=n.o[+b.dataset.i]; path.push(id+':'+b.dataset.i);
      (o.add||[]).forEach(function(k){ if(items.indexOf(k)<0) items.push(k); });
      Object.keys(o.set||{}).forEach(function(k){ flags[k]=o.set[k]; });
      if(o.go) pinta(o.go); else fin();
    }; });
  }
  function fin(){
    store.set('zurron',{items:items,flags:flags,path:path});
    el.innerHTML=mjCabecera('Hacer el zurrón')+'<div class="end"><h2>Zurrón cerrado</h2><div class="got">'+items.map(function(k){return '<div style="display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:.8rem">'+mjIcon(ZICO[k])+ZNOM[k]+'</div>';}).join('')+'</div>'+
      '<p>'+(flags.samFeliz?'Sam va silbando: es su zurrón y está orgulloso.':flags.samEnfadado?'Sam refunfuña por lo bajo por sus cazos.':flags.pesado?'Pesa como un saco de patatas, pero no falta de nada.':'Va ligero: se camina mejor así.')+'</p>'+
      '<p class="note">Lo que llevas se pondrá a prueba durante el camino. Lo que te dé el final del acto, en Cricava, depende de ello.</p>'+
      '<button class="go" type="button" id="mjOk">Salir por la puerta redonda</button></div>';
    el.querySelector('.x').onclick=cerrar; el.querySelector('#mjOk').onclick=cerrar;
  }

    var z=zEstado();
    el.innerHTML=mjCabecera('Hacer el zurrón')+'<div class="end"><h2>Tu zurrón ya está hecho</h2><div class="got">'+z.items.map(function(k){return mjIcon(ZICO[k]);}).join('')+'</div><p class="note">Las decisiones del zurrón solo se toman una vez por viaje.</p>'+
      (DEMO?'<button class="ghost" type="button" id="mjR">Rehacerlo (solo en la prueba)</button>':'')+'<button class="go" type="button" id="mjOk">Volver</button></div>';
    el.querySelector('.x').onclick=cerrar; el.querySelector('#mjOk').onclick=cerrar;
    var r=el.querySelector('#mjR'); if(r) r.onclick=function(){ store.del('zurron'); store.del('fin1'); pinta('inicio'); };
    return;
  }
  pinta('inicio');
}

/* final del acto I al llegar a Cricava */
function finActo(){
  if(store.get('fin1',false)) return false;
  store.set('fin1',true);
  var z=zEstado(), s=zSello(), pz=zPuntos();

  openSheet('<span class="eyebrow">Cricava · 115 km</span><h2>Fin del Acto I</h2>'+
    '<div class="sello" style="background:'+s.c+'">I</div><p style="text-align:center"><b>'+s.t+'</b><br><i>«'+zTitulo()+'»</i></p>'+
    (z?'<p>Así os ha ido con lo que llevabas:</p><ul class="note" style="margin:0;padding-left:1.2em">'+lineas+'</ul>':'<p class="note">No hiciste el zurrón en Bolsón Cerrado, así que el viaje fue a la buena de Dios.</p>')+
    (function(){ store.set('fin1',true); var g=eqGanado(); return g.length?'<p><b>Has ganado:</b></p><div class="got">'+g.map(function(k){return '<div style="display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:.8rem;max-width:90px;text-align:center"><div style="width:44px;height:44px;display:grid;place-items:center">'+eqIcon(k)+'</div>'+EQ[k].n+'</div>';}).join('')+'</div><p class="note">Ya lo llevas puesto. Puedes quitártelo o ponerte otra cosa en Zurrón › Vestuario.</p>':''; })()+
    '<button class="primary" id="shOk" type="button">Seguir hacia el Bosque Viejo</button>');
  $('shOk').onclick=closeSheet; return true;
}

/* ================= RECOMPENSAS DEL ACTO I (personalización) =================

  o.type='square'; o.frequency.value=880+Math.random()*120; g.gain.value=.018; o.connect(g); g.connect(AUD.destination);
  var t=AUD.currentTime; g.gain.setValueAtTime(.018,t); g.gain.exponentialRampToValueAtTime(.0001,t+.04); o.start(t); o.stop(t+.045); }catch(e){} }
function dialogo(lineas,alAcabar){

  var app=$('app'), veil=document.createElement('div'), box=document.createElement('div');
  veil.className='dlg-veil'; box.className='dlg'; box.setAttribute('role','dialog'); box.setAttribute('aria-live','polite');
  app.appendChild(veil); app.appendChild(box);
  var k=0, pos=0, timer=null, full='';
  function pinta(){
    var L=lineas[k]; full=L.t; pos=0;
    box.innerHTML=(L.who?'<div class="who">'+(L.icon&&ICON[L.icon]?ICON[L.icon]:'')+L.who+'</div>':'')+'<p></p><span class="pg">'+(lineas.length>1?(k+1)+'/'+lineas.length:'')+'</span><span class="nx" hidden>▼</span>';

      if(pos>=full.length){ clearInterval(timer); timer=null; box.querySelector('.nx').hidden=false; } },26);
  }
  function toca(e){ if(e) e.stopPropagation();
    if(timer){ clearInterval(timer); timer=null; box.querySelector('p').textContent=full; box.querySelector('.nx').hidden=false; return; }
    k++; if(k<lineas.length){ pinta(); return; }

  function tecla(e){ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); toca(); } }

    /* luz de la forja que respira y titila */
    var fl=0.10+0.06*Math.sin(t*2.1)+0.04*Math.sin(t*7.3)+0.03*Math.sin(t*13.1);
    x.globalCompositeOperation='lighter'; x.globalAlpha=Math.max(0,fl); x.drawImage(bg,ox,oy,bw,bh); x.globalAlpha=1; x.globalCompositeOperation='source-over';
    /* el anillo sobre el yunque, latiendo */
    var ax=ox+bw*0.5, ay=oy+bh*0.565, rw=bw*0.26, rh=rw*ring.height/Math.max(1,ring.width), bob=Math.sin(t*1.3)*bh*0.004;
    if(ring.complete&&ring.width){ x.drawImage(ring,ax-rw/2,ay-rh*0.72+bob,rw,rh);
      x.globalCompositeOperation='lighter'; x.globalAlpha=0.18+0.18*(0.5+0.5*Math.sin(t*2.4)); x.drawImage(ring,ax-rw/2,ay-rh*0.72+bob,rw,rh); x.globalAlpha=1; x.globalCompositeOperation='source-over'; }
    /* chispas que suben del anillo */
    if(Math.random()<dt/90) parts.push({x:ax+(Math.random()-.5)*rw*0.8,y:ay-rh*0.3,vx:(Math.random()-.5)*0.02*W/400,vy:-(0.04+Math.random()*0.05)*H/700,life:0,max:1100+Math.random()*900,sc:0.12+Math.random()*0.14});
    var n=P.chispas.n, fw=P.chispas.fw, fh=P.chispas.h;
    parts=parts.filter(function(p){ p.life+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.life>p.max) return false;
      if(sp.complete&&sp.width){ var f=Math.min(n-1,Math.floor(p.life/p.max*n)), w=fw*p.sc*bw/768, h=fh*p.sc*bw/768;
        x.globalCompositeOperation='lighter'; x.drawImage(sp,f*fw,0,fw,fh,p.x-w/2,p.y-h,w,h); x.globalCompositeOperation='source-over'; }
      return true; });
    requestAnimationFrame(frame);
  }
  return { on:function(){ if(run) return; run=true; last=0; size(); requestAnimationFrame(frame); }, off:function(){ run=false; } };
})();
