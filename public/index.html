var AUTH=store.get('auth',null);   /* {at, rt, exp} */
function saveAuth(j){ AUTH = j&&j.access_token ? {at:j.access_token, rt:j.refresh_token, exp:Date.now()+(j.expires_in||3600)*1000, em:(j.user&&j.user.email)||(AUTH&&AUTH.em)||''} : null; if(AUTH) store.set('auth',AUTH); else store.del('auth'); }
function timed(url,opt){ var ctl=new AbortController(), tm=setTimeout(function(){ctl.abort();},10000); opt.signal=ctl.signal;
  return fetch(url,opt).then(function(r){ return r.text().then(function(t){ clearTimeout(tm); var j=null; try{j=t?JSON.parse(t):null;}catch(e){}
    if(!r.ok){ var e=new Error((j&&(j.msg||j.message||j.error_description||j.error))||('Error '+r.status)); e.status=r.status; throw e; } return j; }); }); }
function authReq(path,body){ return timed(SB_URL+'/auth/v1/'+path,{method:'POST',headers:{apikey:SB_KEY,'Content-Type':'application/json'},body:JSON.stringify(body)}); }
function fresh(){
  if(DEMO||!AUTH) return Promise.resolve(AUTH);
  if(Date.now()<AUTH.exp-60000) return Promise.resolve(AUTH);
  return authReq('token?grant_type=refresh_token',{refresh_token:AUTH.rt}).then(function(j){saveAuth(j);return AUTH;})
    .catch(function(e){ if(e.status===400||e.status===401) saveAuth(null); return AUTH; });
}
function rpc(fn,body){
  if(DEMO) return Promise.resolve(demoRpc(fn,body||{}));
  return fresh().then(function(a){
    var h={apikey:SB_KEY,'Content-Type':'application/json'}; if(a) h.Authorization='Bearer '+a.at;
    return timed(SB_URL+'/rest/v1/rpc/'+fn,{method:'POST',headers:h,body:JSON.stringify(body||{})});
  });
}
function authErr(e){ var m=String(e&&e.message||e||'');
  if(/invalid login/i.test(m)) return 'Correo o contraseña incorrectos.';
  if(/not confirmed/i.test(m)) return 'Aún no has confirmado tu correo. Busca el email de confirmación (mira también en spam).';
  if(/already registered|already been registered|exists/i.test(m)) return 'Ya hay una cuenta con ese correo. Entra con ella.';
  if(/password/i.test(m)&&/6|short|characters/i.test(m)) return 'La contraseña tiene que tener al menos 6 caracteres.';
  if(/valid email|invalid.*email/i.test(m)) return 'Ese correo no parece válido.';
  if(/rate limit|too many/i.test(m)) return 'Demasiados intentos seguidos. Espera unos minutos.';

  ctx.strokeStyle='rgba(200,215,235,.55)'; ctx.lineWidth=1; ctx.beginPath();
  drops.forEach(function(d){d.y+=d.s*dt*.12; d.x-=dt*.03; if(d.y>H){d.y=-6;d.x=Math.random()*W;} ctx.moveTo(d.x,d.y); ctx.lineTo(d.x-1.5,d.y+6);});

}

function loop(now){
  var dt=Math.min(50,now-last); last=now; var h=hourNow();
  off+=(window.PARADO?0:dt*(reduce?0.01:(M.andar.vel||0.058))*(window.PASEO_DIR||1));
  if(me && target>km+0.001 && $('sheet').hidden){ off+=dt*0.04; setKm(km+Math.min(target-km, dt*0.0015)); }
  var e=escAt(km); if(curE<0) curE=e; if(e!==curE){ prevE=curE; curE=e; fade=reduce?1:0; }
  if(fade<1&&prevE>=0){drawTramo(prevE,1,off);drawTramo(curE,fade,off);fade=Math.min(1,fade+dt/700);} else drawTramo(curE,1,off);
  dibujaProps(off);

}

/* ---------- avance ---------- */
function setKm(v){
  if(Math.abs(target-v)<0.002) v=target;   /* el paso se para a 0,001 del objetivo: sin esto se quedaba en 139,9998 y no «llegaba» al tramo */
  km=v; store.set('km',km);
  var t=tramoAt(km);
  if(t!==curT){ prevT=curT; curT=t; }
  if(t>reached) reached=t;
  renderHud();
  if(km>=target-0.001) flushPending();
}
function flushPending(){
  if(!$('sheet').hidden) return;

  if(km>=TOTAL_KM-0.001 && pending.length===0 && typeof finActo2==='function' && finActo2()) return;
  pending=pending.filter(function(i){return !shown.has(i) && i<=tramoAt(km);});
  if(pending.length) openArrival(pending.shift());
}

function leidas(i){
  var n=frases(i).length, cur=tramoAt(km);
  if(i<cur || km>=TOTAL_KM) return n;
  if(i>cur) return 0;

/* ---------- mapa ---------- */
function rutaPunto(k){
  var Lg=M.mapa.lugares, r=M.mapa.ruta;
  k=Math.max(0,Math.min(Lg[Lg.length-1][0],k));
  if(M.mapa.idx){ /* el tercer dato de cada sitio es su punto en la ruta: se avanza por el camino dibujado */
    for(var i=0;i<Lg.length-1;i++){ if(k<=Lg[i+1][0]){
      var t=(k-Lg[i][0])/(Lg[i+1][0]-Lg[i][0]), a0=Lg[i][2], a1=Lg[i+1][2], L=[0], s=0, j;
      for(j=a0;j<a1;j++){ s+=Math.hypot(r[j+1][0]-r[j][0],r[j+1][1]-r[j][1]); L.push(s); }
      var want=t*s; for(j=0;j<L.length-1;j++){ if(want<=L[j+1]){ var u=L[j+1]===L[j]?0:(want-L[j])/(L[j+1]-L[j]), p=r[a0+j], q=r[a0+j+1]; return [p[0]+(q[0]-p[0])*u, p[1]+(q[1]-p[1])*u, a0+j]; } }
      return [r[a1][0], r[a1][1], a1]; } }
    var z=r[r.length-1]; return [z[0], z[1], r.length-1];
  }
  var y;
  for(var i=0;i<Lg.length-1;i++){ if(k<=Lg[i+1][0]){ var t=(k-Lg[i][0])/(Lg[i+1][0]-Lg[i][0]); y=Lg[i][2]+(Lg[i+1][2]-Lg[i][2])*t; break; } }
  if(y==null) y=Lg[Lg.length-1][2];
  for(var j=0;j<r.length-1;j++){ var a=r[j],b=r[j+1]; if((a[1]-y)*(b[1]-y)<=0){ var u=a[1]===b[1]?0:(y-a[1])/(b[1]-a[1]); return [a[0]+(b[0]-a[0])*u, y, j]; } }
  return [r[r.length-1][0], y, r.length-1];
}

/* ---------- 1 · HACER EL ZURRÓN (tramo 1) ---------- */
function jugarZurron(el,cerrar){
  var CAP=8, DUR=30;
  function intro(){
    el.innerHTML='<div class="hd"><h2>Hacer el zurrón</h2><button class="x" type="button" aria-label="Cerrar">×</button></div>'+
      '<div class="intro"><p>Frodo se va mañana y el zurrón solo tiene <b>'+CAP+' huecos</b>. Por la mesa van pasando cosas de Bolsón Cerrado: <b>toca las que sirven para el camino</b> y deja pasar las demás.</p>'+
      '<div class="ex"><div>'+mjIcon('pan')+'Pan</div><div>'+mjIcon('cuerda')+'Cuerda</div><div>'+mjIcon('farol')+'Farol</div><div class="no">'+mjIcon('sillon')+'Sillón</div><div class="no">'+mjIcon('reloj')+'Reloj</div></div>'+
      '<p class="note">Acierto +1 · cosa inútil −1 · '+DUR+' segundos. '+(mjBest('zurron')?'Tu mejor resultado: '+mjStars(mjBest('zurron')):'')+'</p>'+
      '<button class="go" type="button" id="mjGo">Empezar</button></div>';
    el.querySelector('.x').onclick=cerrar; el.querySelector('#mjGo').onclick=jugar;
  }
  function jugar(){
    el.innerHTML='<div class="hd"><h2>Hacer el zurrón</h2><div class="stat"><span id="mjT">'+DUR+'</span><span id="mjP">0</span></div></div>'+
      '<div class="field" id="mjF"><div class="table"></div><div class="msg" id="mjM"></div><div class="bag">'+BAG_SVG+'<div class="slots" id="mjS"></div></div></div>';
    var F=el.querySelector('#mjF'), S=el.querySelector('#mjS'), M=el.querySelector('#mjM');
    try{ F.style.background='url('+cv.toDataURL()+') center 30%/cover no-repeat, #a8763a'; }catch(e){}
    for(var i=0;i<CAP;i++) S.appendChild(document.createElement('i'));
    var pts=0, packed=[], live=[], t0=performance.now(), lastSpawn=-9, raf=0, done=false, msgT=0;
    /* baraja: 60 % útiles, sin repetir la misma cosa seguida */
    var deck=[], prev=null;
    function next(){ var pool=ZURRON_ITEMS.filter(function(x){return x!==prev;}); var useful=Math.random()<.6;
      var c=pool.filter(function(x){return x.ok===useful;}); prev=c[Math.floor(Math.random()*c.length)]; return prev; }
    function say(t,bad){ M.textContent=t; M.className='msg on'+(bad?' bad':''); clearTimeout(msgT); msgT=setTimeout(function(){M.className='msg';},1600); }
    function spawn(){
      var it=next(), b=document.createElement('button'); b.type='button'; b.className='it';
      b.innerHTML=mjIcon(it)+it.n; F.appendChild(b);
      var o={el:b,it:it,x:F.clientWidth+50,v:(F.clientWidth+100)/(2.9-Math.min(1.2,(performance.now()-t0)/30000*1.2))};
      b.style.left=o.x+'px';
      b.onpointerdown=function(e){ e.preventDefault(); if(done||o.gone) return; o.gone=true; b.classList.add('fly');
        setTimeout(function(){b.remove();},380);
        if(it.ok){ pts++; packed.push(it); say('¡'+it.n+' al zurrón!'); }
        else { pts=Math.max(0,pts-1); say(it.q,true); }
        S.querySelectorAll('i').forEach(function(d,j){ d.className=j<packed.length?'on':''; });
        el.querySelector('#mjP').textContent=pts;
        if(packed.length>=CAP) fin();
      };
      live.push(o);
    }
    var last=performance.now();
    function tick(now){
      var dt=(now-last)/1000; last=now; var t=(now-t0)/1000;
      el.querySelector('#mjT').textContent=Math.max(0,Math.ceil(DUR-t));
      var gap=1.25-Math.min(.5,t/DUR*.5);
      if(t-lastSpawn>gap){ spawn(); lastSpawn=t; }
      live=live.filter(function(o){ if(o.gone) return false; o.x-=o.v*dt; o.el.style.left=o.x+'px'; if(o.x<-60){ o.el.remove(); return false; } return true; });
      if(t>=DUR) return fin();
      raf=requestAnimationFrame(tick);
    }
    function fin(){
      if(done) return; done=true; cancelAnimationFrame(raf);
      var st=pts>=7?3:pts>=5?2:pts>=3?1:0; mjSaveBest('zurron',st);
      var frase=['El zurrón va más vacío que una despensa después de la fiesta.','Algo es algo: no os moriréis de hambre el primer día.','Buen zurrón. Sam estaría orgulloso.','Zurrón perfecto: ni Bilbo lo habría hecho mejor.'][st];
      el.innerHTML='<div class="hd"><h2>Hacer el zurrón</h2><button class="x" type="button" aria-label="Cerrar">×</button></div>'+
        '<div class="end"><div class="stars" aria-label="'+st+' de 3 estrellas">'+mjStars(st)+'</div><p><b>'+pts+' puntos.</b> '+frase+'</p>'+
        (packed.length?'<div class="got">'+packed.map(mjIcon).join('')+'</div>':'')+
        premiosHtml('zurron')+
        '<div class="row2"><button class="ghost" type="button" id="mjR">Otra vez</button><button class="go" type="button" id="mjOk">Seguir andando</button></div></div>';
      el.querySelector('.x').onclick=cerrar; el.querySelector('#mjOk').onclick=cerrar; el.querySelector('#mjR').onclick=jugar;
    }
    el._stop=function(){ done=true; cancelAnimationFrame(raf); };
    raf=requestAnimationFrame(tick);
  }
  intro();
}

function mjFondo(F){ try{ F.style.background='url('+cv.toDataURL()+') center 30%/cover no-repeat, #6d8a3a'; }catch(e){} }

/* ---------- 2 · QUIETO BAJO EL ÁRBOL (tramo 3) ----------
   Mantén el dedo pulsado y quieto mientras pasa el jinete. Si sueltas o mueves el dedo, sube la sospecha.
   El Anillo susurra para que sueltes. */
function jugarArbol(el,cerrar){
  var ID='arbol', TIT='Quieto bajo el árbol', DUR=18, conSensor=!!window.DeviceMotionEvent;
  function intro(){ mjIntro(el,ID,TIT,'<p>Se oyen cascos en el camino. Frodo y los suyos se meten entre las raíces del árbol.</p><p><i>Algo pesa en tu bolsillo.</i></p>',empezar,cerrar); }
  function empezar(){
    var D=window.DeviceMotionEvent;
    var prueba=function(){ if(!conSensor){ jugar(); return; } var vio=false, f=function(){ vio=true; }; addEventListener('devicemotion',f);
      setTimeout(function(){ removeEventListener('devicemotion',f); conSensor=vio; jugar(); },700); };
    if(D && typeof D.requestPermission==='function') D.requestPermission().then(function(r){ conSensor=r==='granted'; prueba(); }).catch(function(){ conSensor=false; jugar(); });
    else prueba();
  }
  function jugar(){
    el.innerHTML=mjCabecera(TIT,'<div class="stat"><span id="mjT">'+DUR+'</span></div>')+
      '<div class="field" id="mjF"><div class="tree">'+mjImg('arbol')+'</div><div class="meter"><span>Sospecha del jinete</span><div class="b"><i id="mjB"></i></div></div><div class="rider" id="mjJ">'+(M.mj&&M.mj.jinete1?'<img id="mjJi" src="'+M.mj.jinete1+'" alt="" style="width:100%;height:100%;object-fit:contain;image-rendering:pixelated">':SVG_JINETE)+'</div><div class="dark" id="mjD"></div><div class="whisper" id="mjW"></div>'+
      (conSensor?'<div class="hold" id="mjH" style="pointer-events:none">…</div>':'<button class="hold" id="mjH" type="button">Escondido</button>')+'</div>';
    var F=el.querySelector('#mjF'), H=el.querySelector('#mjH'), B=el.querySelector('#mjB'), J=el.querySelector('#mjJ'), Dk=el.querySelector('#mjD'), Wh=el.querySelector('#mjW');
    mjFondo(F);
    var sus=0, maxSus=0, mov=0, base=null, t0=performance.now(), last=t0, raf=0, done=false, wT=0, holding=false, sx=0, sy=0;
    var FR=['Póntelo… nadie te verá','Muévete, será solo un momento','Él no puede encontrarte si te lo pones','¿Por qué esconderse? Póntelo','Sal corriendo…'];
    function onMov(e){ var a=e.accelerationIncludingGravity; if(!a||a.x==null) return; var m=Math.sqrt(a.x*a.x+a.y*a.y+a.z*a.z);
      base=base==null?m:base*0.9+m*0.1; mov=Math.max(mov*0.85, Math.abs(m-base)); }
    if(conSensor) addEventListener('devicemotion',onMov);
    else { H.onpointerdown=function(e){ e.preventDefault(); holding=true; sx=e.clientX; sy=e.clientY; H.classList.add('on'); try{H.setPointerCapture(e.pointerId);}catch(_){} };
      H.onpointermove=function(e){ if(holding && Math.hypot(e.clientX-sx,e.clientY-sy)>18){ sus+=6; sx=e.clientX; sy=e.clientY; } };
      var up=function(){ holding=false; H.classList.remove('on'); }; H.onpointerup=up; H.onpointercancel=up; H.onlostpointercapture=up; }
    function tick(now){
      var dt=(now-last)/1000; last=now; var t=(now-t0)/1000, p=t/DUR;
      var x=-0.2+1.4*p; J.style.left=(x*100)+'%';
      var near=Math.max(0,1-Math.abs(x-0.5)*2.2);
      var ji=el.querySelector('#mjJi'); if(ji&&M.mj.jinete2) ji.src=(Math.floor(t*2.2)%2&&near>0.3)?M.mj.jinete2:M.mj.jinete1;
      if(conSensor){ var quieto=mov<0.6; if(!quieto) sus+=dt*(25+90*near)*Math.min(3,mov); else sus=Math.max(0,sus-dt*6);
        H.textContent=quieto?'…':'¡Te estás moviendo!'; H.classList.toggle('on',quieto); }
      else { if(!holding) sus+=dt*(18+60*near); else sus=Math.max(0,sus-dt*4); }
      sus=Math.min(100,sus); maxSus=Math.max(maxSus,sus); B.style.width=sus+'%';
      Dk.style.opacity=(0.25+0.6*near).toFixed(2);
      if(now-wT>2600 && near>0.2){ wT=now; Wh.innerHTML=(M.mj&&M.mj.anillo?'<img src="'+M.mj.anillo+'" alt="" style="width:40px;height:40px;display:block;margin:0 auto 4px;image-rendering:pixelated">':'')+FR[Math.floor(Math.random()*FR.length)]; Wh.classList.add('on'); setTimeout(function(){Wh.classList.remove('on');},1500); }
      el.querySelector('#mjT').textContent=Math.max(0,Math.ceil(DUR-t));
      if(sus>=100) return anillo();
      if(t>=DUR) return fin(false);
      raf=requestAnimationFrame(tick);
    }
    /* te ha pillado: te pones el Anillo y el mundo se vuelve gris y borroso */
    function anillo(){
      if(done) return; done=true; cancelAnimationFrame(raf); removeEventListener('devicemotion',onMov);
      F.style.transition='filter 1.6s ease'; F.style.filter='grayscale(1) blur(2.5px) contrast(1.3) brightness(.8)';
      var o=document.createElement('div'); o.style.cssText='position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;color:#f3e2b4;padding:20px;background:radial-gradient(circle,rgba(0,0,0,.2),rgba(0,0,0,.75));opacity:0;transition:opacity 1.2s';
      o.innerHTML=(M.mj&&M.mj.anillo?'<img src="'+M.mj.anillo+'" alt="" style="width:90px;image-rendering:pixelated;filter:drop-shadow(0 0 14px #e2a54a)">':'')+'<b style="font-family:var(--title);font-size:1.2rem">Te has puesto el Anillo</b><span>Todo se vuelve gris. El jinete se gira hacia ti… y sientes que te ve, aunque nadie más pueda.</span>';
      F.parentNode.appendChild(o); requestAnimationFrame(function(){ o.style.opacity='1'; });
      setTimeout(function(){ o.remove(); F.style.filter=''; fin(true); },3600);
    }
    function fin(visto){
      done=true; cancelAnimationFrame(raf); removeEventListener('devicemotion',onMov);
      var st=visto?0:maxSus<30?3:maxSus<60?2:1;
      var txt=visto?'<b>Te pusiste el Anillo.</b> El jinete se acercó demasiado; por suerte, se oyeron voces en el camino y se marchó. Esta vez no te ha salido.':['','Se ha ido… por los pelos.','Se ha ido sin veros. Sam respira.','Ni una hoja se ha movido. El jinete se pierde en la noche.'][st];
      mjFin(el,ID,TIT,st,txt,jugar,cerrar);
    }
    el._stop=function(){ done=true; cancelAnimationFrame(raf); removeEventListener('devicemotion',onMov); };
    raf=requestAnimationFrame(tick);
  }
  intro();
}

/* ---------- 3 · SETAS A ESCONDIDAS (tramo 6) ----------
   Topo clásico: toca las setas que asoman, nunca a los perros del granjero. */
function jugarSetas(el,cerrar){
  var ID='setas', TIT='Setas a escondidas', DUR=30;
  function intro(){ mjIntro(el,ID,TIT,'<p>Los campos del granjero Maggot. De pequeño, Frodo venía aquí a por setas… y el granjero tenía perros.</p>',jugar,cerrar); }
  function jugar(){
    el.innerHTML=mjCabecera(TIT,'<div class="stat"><span id="mjT">'+DUR+'</span><span id="mjP">0</span></div>')+'<div class="field" id="mjF"><div class="msg" id="mjM"></div><div class="grid" id="mjG"></div></div>';
    var F=el.querySelector('#mjF'), G=el.querySelector('#mjG'), Msg=el.querySelector('#mjM'); mjFondo(F);
    var holes=[]; for(var i=0;i<9;i++){ var h=document.createElement('div'); h.className='hole'; if(M.mj&&M.mj.hoyo){ h.style.background='url('+M.mj.hoyo+') center 85%/100% auto no-repeat'; } G.appendChild(h); holes.push({el:h,busy:false}); }
    var pts=0, t0=performance.now(), raf=0, done=false, lastPop=-9, mT=0;
    function say(t,bad){ Msg.textContent=t; Msg.className='msg on'+(bad?' bad':''); clearTimeout(mT); mT=setTimeout(function(){Msg.className='msg';},1100); }
    function pop(t){
      var free=holes.filter(function(h){return !h.busy;}); if(!free.length) return;
      var h=free[Math.floor(Math.random()*free.length)], dog=Math.random()<0.25+0.1*(t/DUR);
      var b=document.createElement('button'); b.type='button'; b.className='pop'; b.innerHTML=dog?mjImg('perro'+(1+Math.floor(Math.random()*3)),SVG_PERRO):mjImg('seta'+(1+Math.floor(Math.random()*3)),SVG_SETA); b.setAttribute('aria-label',dog?'Perro':'Seta');
      h.el.appendChild(b); h.busy=true; requestAnimationFrame(function(){ b.classList.add('up'); });
      var life=1100-500*(t/DUR), gone=false;
      var quit=function(){ if(gone) return; gone=true; b.classList.remove('up'); setTimeout(function(){ b.remove(); h.busy=false; },160); };
      b.onpointerdown=function(e){ e.preventDefault(); if(done||gone) return;
        if(dog){ pts=Math.max(0,pts-2); say('¡Guau! El perro te ha olido. −2',true); } else { pts++; }
        el.querySelector('#mjP').textContent=pts; quit(); };
      setTimeout(quit,life);
    }
    function tick(now){
      var t=(now-t0)/1000; el.querySelector('#mjT').textContent=Math.max(0,Math.ceil(DUR-t));
      if(t-lastPop>0.75-0.35*(t/DUR)){ pop(t); lastPop=t; }
      if(t>=DUR) return fin();
      raf=requestAnimationFrame(tick);
    }
    function fin(){ if(done) return; done=true; cancelAnimationFrame(raf);
      var st=pts>=18?3:pts>=12?2:pts>=6?1:0;
      mjFin(el,ID,TIT,st,'<b>'+pts+' setas.</b> '+['Los perros te han dado más guerra que las setas.','Para una tortilla pequeña da.','Buena cesta. El granjero ni se ha enterado.','Cesta llena. Como cuando Frodo era pequeño.'][st],jugar,cerrar); }
    el._stop=function(){ done=true; cancelAnimationFrame(raf); };
    raf=requestAnimationFrame(tick);
  }
  intro();
}

/* ---------- 4 · LA BALSA (tramo 8) ----------
   Toca «Empujar» cuando la marca pase por la zona verde. Llega a la otra orilla antes de que la sombra llegue al embarcadero. */
function jugarBalsa(el,cerrar){
  var ID='balsa', TIT='La balsa', DUR=20;
  function intro(){ mjIntro(el,ID,TIT,'<p>La balsa está atada al embarcadero. Detrás, en la niebla, algo negro se acerca.</p>',jugar,cerrar); }
  function jugar(){
    el.innerHTML=mjCabecera(TIT,'<div class="stat"><span id="mjT">'+DUR+'</span></div>')+
      '<div class="field" id="mjF"><div class="river"'+(M.mj&&M.mj.rio?' style="background:url('+M.mj.rio+') center/auto 100% repeat-x"':'')+'></div><div class="shore" style="left:0">'+mjImg('muelle')+'</div><div class="shore" style="right:0">'+mjImg('juncos')+'</div><div class="shadow" id="mjS">'+mjImg('sombra')+'</div><div class="raft" id="mjR">'+mjImg('balsa1')+'</div><div class="msg" id="mjM"></div>'+
      '<div class="rhythm"><div class="z" id="mjZ"></div><div class="k" id="mjK"></div></div><button class="push" id="mjP" type="button">Empujar</button></div>';
    var F=el.querySelector('#mjF'), R=el.querySelector('#mjR'), S=el.querySelector('#mjS'), K=el.querySelector('#mjK'), Z=el.querySelector('#mjZ'), Msg=el.querySelector('#mjM');
    var prog=0, t0=performance.now(), raf=0, done=false, zone=[0.4,0.6], mT=0, pos=0;
    function newZone(){ var w=0.2-0.08*Math.min(1,prog); var a=0.15+Math.random()*(0.7-w); zone=[a,a+w]; Z.style.left=(a*100)+'%'; Z.style.width=(w*100)+'%'; }
    function say(t,bad){ Msg.textContent=t; Msg.className='msg on'+(bad?' bad':''); clearTimeout(mT); mT=setTimeout(function(){Msg.className='msg';},800); }
    newZone();
    el.querySelector('#mjP').onpointerdown=function(e){ e.preventDefault(); if(done) return;
      var ri=R.querySelector('img'); if(ri&&M.mj.balsa2){ ri.src=M.mj.balsa2; setTimeout(function(){ ri.src=M.mj.balsa1; },350); }
      if(pos>=zone[0]&&pos<=zone[1]){ prog+=0.11; say('¡Buen empujón!'); } else { prog+=0.02; say('Casi…',true); }
      newZone(); if(prog>=1) fin(true); };
    function tick(now){
      var t=(now-t0)/1000; pos=(Math.sin(t*(2.6+1.2*Math.min(1,prog)))+1)/2;
      K.style.left=(pos*100)+'%'; R.style.left=(16+68*Math.min(1,prog)+5)+'%';
      S.style.left=(4+12*Math.min(1,t/DUR))+'%';
      el.querySelector('#mjT').textContent=Math.max(0,Math.ceil(DUR-t));
      if(t>=DUR) return fin(false);
      raf=requestAnimationFrame(tick);
    }
    function fin(ok){ if(done) return; done=true; cancelAnimationFrame(raf);
      var left=Math.max(0,DUR-(performance.now()-t0)/1000);
      var st=!ok?0:left>8?3:left>4?2:1;
      mjFin(el,ID,TIT,st,ok?(st===3?'Habéis cruzado de sobra: la sombra se queda mirando desde la otra orilla.':'Habéis cruzado. La sombra llega al embarcadero demasiado tarde.'):'<b>La sombra ha llegado al agua</b> antes de que llegarais a la orilla. Menos mal que no sabe nadar.',jugar,cerrar); }
    el._stop=function(){ done=true; cancelAnimationFrame(raf); };
    raf=requestAnimationFrame(tick);
  }
  intro();
}

/* ================= DECISIONES DEL ZURRÓN (sustituye al minijuego del tramo 1) =================
   Árbol de 3 decisiones en Bolsón Cerrado. Lo que eliges se guarda (loc.zurron) y se comprueba
   en 5 momentos del acto. Al llegar a Cricava, el final del acto depende de esos momentos. */
var ZDEC={
  inicio:{t:'Esta noche os vais de Bolsón Cerrado',
    p:'Gandalf no ha vuelto y no se puede esperar más. Queda hacer el zurrón. ¿Cómo lo haces?',
    o:[{l:'Ligero, para ir deprisa',d:'Una sola cosa grande, y a correr.',set:{ligero:1},go:'ligero'},

       {l:'Lo que diga Sam',d:'Sam lleva días preparándolo todo.',go:'sam'}]},
  ligero:{t:'Solo cabe una cosa grande',p:'El zurrón va casi vacío. ¿Qué metes?',
    o:[{l:'La manta de lana',d:'Las noches de otoño son frías.',add:['manta'],go:'bilbo'},
       {l:'El farol de viaje',d:'Para no perderse a oscuras.',add:['farol'],go:'bilbo'},
       {l:'Un buen rollo de cuerda',d:'Una cuerda siempre hace falta.',add:['cuerda'],go:'bilbo'}]},
  pesado:{t:'Toca elegir qué lote llevas',p:'Cabe mucho, pero el zurrón pesa como un saco de patatas.',

       {l:'Herramientas',d:'Cuerda y farol.',add:['cuerda','farol'],go:'bilbo'}]},
  sam:{t:'Sam ha llenado el zurrón de cacharros',p:'Sartén, cazos, sal, una caja de cerillas… «Por si acaso, señor Frodo».',
    o:[{l:'Dejarle hacer',d:'Sam sabe lo que hace.',add:['sarten','pan'],set:{samFeliz:1},go:'bilbo'},
       {l:'Sacar los cazos y meter la manta',d:'A Sam no le va a hacer gracia.',add:['manta'],set:{samEnfadado:1},go:'bilbo'},
       {l:'Sacar los cazos y meter el farol',d:'A Sam no le va a hacer gracia.',add:['farol'],set:{samEnfadado:1},go:'bilbo'}]},
  bilbo:{t:'Bilbo dejó algo en la repisa',p:'Antes de cerrar la puerta redonda ves tres cosas que Bilbo no se llevó. Solo te da tiempo a coger una.',
    o:[{l:'Su mapa de la Comarca',d:'Lleno de notas a lápiz.',add:['mapa'],go:null},

};
var ZNOM={manta:'Manta',farol:'Farol',cuerda:'Cuerda',sarten:'Sartén',pan:'Pan y queso',capa:'Capa de lluvia',mapa:'Mapa de Bilbo',panuelo:'Pañuelos de Bilbo',cantimplora:'Cantimplora'};
var ZICO={manta:'manta',farol:'farol',cuerda:'cuerda',sarten:'cucharas',pan:'pan',capa:'paraguas',mapa:'mapa',panuelo:'libraco',cantimplora:'cantimplora'};
/* momentos del acto: tramo → qué se comprueba */
var ZMOM={
  3:{need:['manta'],ok:'Dormís al raso con los elfos. Gracias a la manta, pasas la noche caliente.',ko:'Dormís al raso con los elfos. Sin manta, tiritas hasta el amanecer.'},
  4:{need:['mapa'],ok:'Con el mapa de Bilbo encontráis los pasos buenos de las zanjas.',ko:'Sin mapa, os metéis en todas las zarzas del atajo.'},
  5:{need:['sarten'],ok:'Con la sartén de Sam, las setas del granjero acaban en una cena de reyes.',ko:'Tenéis setas, pero nada en qué cocinarlas.'},

function zEstado(){ return store.get('zurron',null); }
function zTiene(k){ var z=zEstado(); return !!(z&&z.items.indexOf(k)>=0); }
function zMomentoHtml(i){
  var m=ZMOM[i], z=zEstado(); if(!m||!z) return '';
  var ok=m.need.some(zTiene);
  return '<div class="bubble">'+mjIcon(ZICO[m.need[0]])+'<div><b>'+(ok?'Tu zurrón te ha salvado':'Te faltó algo en el zurrón')+'</b><i>'+(ok?m.ok:m.ko)+'</i></div></div>';
}
function zPuntos(){
  var z=zEstado(); if(!z) return {p:0,tot:5,acier:[]};
  var acier=Object.keys(ZMOM).filter(function(i){ return ZMOM[i].need.some(zTiene); });
  var p=acier.length+(z.flags.samFeliz?1:0)-(z.flags.samEnfadado?1:0)-(z.flags.pesado?1:0)+(z.flags.ligero?1:0);
  return {p:Math.max(0,p),acier:acier};
}
/* sello de cada acto: dibujo de ChatGPT (M.sellos.a1_oro…); mientras no llegue, no se pinta nada (fuera el círculo con el número) */

function zSello(){ var p=zPuntos().p; return p>=4?{n:'oro',t:'Sello de oro del Acto I',c:'#d4a531'}:p>=2?{n:'plata',t:'Sello de plata del Acto I',c:'#b8bfc6'}:{n:'bronce',t:'Sello de bronce del Acto I',c:'#b07a43'}; }
function zTitulo(){ var z=zEstado()||{flags:{},items:[]};
  if(z.flags.samFeliz) return 'El que hizo caso a Sam';
  if(z.flags.samEnfadado) return 'El que discutió con Sam';
  if(z.flags.ligero) return 'Pies ligeros';

function jugarDecisiones(el,cerrar){
  var path=[], items=[], flags={};
  function pinta(id){
    var n=ZDEC[id];
    el.innerHTML=mjCabecera('Hacer el zurrón')+'<div class="intro"><span class="eyebrow">Decisión '+(path.length+1)+' de 3</span><h2 style="font-size:1.2rem">'+n.t+'</h2><p>'+n.p+'</p>'+
      (items.length?'<div class="got">'+items.map(function(k){return mjIcon(ZICO[k]);}).join('')+'</div>':'')+
      '<div class="opts">'+n.o.map(function(o,i){return '<button class="opt" type="button" data-i="'+i+'"><b>'+o.l+'</b><span>'+o.d+'</span></button>';}).join('')+'</div></div>';
    el.querySelector('.x').onclick=cerrar;
    el.querySelectorAll('.opt').forEach(function(b){ b.onclick=function(){
      var o=n.o[+b.dataset.i]; path.push(id+':'+b.dataset.i);
      (o.add||[]).forEach(function(k){ if(items.indexOf(k)<0) items.push(k); });
      Object.keys(o.set||{}).forEach(function(k){ flags[k]=o.set[k]; });
      if(o.go) pinta(o.go); else fin();
    }; });
  }
  function fin(){
    store.set('zurron',{items:items,flags:flags,path:path});
    el.innerHTML=mjCabecera('Hacer el zurrón')+'<div class="end"><h2>Zurrón cerrado</h2><div class="got">'+items.map(function(k){return '<div style="display:flex;flex-direction:column;align-items:center;font-weight:700;font-size:.8rem">'+mjIcon(ZICO[k])+ZNOM[k]+'</div>';}).join('')+'</div>'+
      '<p>'+(flags.samFeliz?'Sam va silbando: es su zurrón y está orgulloso.':flags.samEnfadado?'Sam refunfuña por lo bajo por sus cazos.':flags.pesado?'Pesa como un saco de patatas, pero no falta de nada.':'Va ligero: se camina mejor así.')+'</p>'+
      '<p class="note">Lo que llevas se pondrá a prueba durante el camino. Lo que te dé el final del acto, en Cricava, depende de ello.</p>'+
      '<button class="go" type="button" id="mjOk">Salir por la puerta redonda</button></div>';
    el.querySelector('.x').onclick=cerrar; el.querySelector('#mjOk').onclick=cerrar;
  }
  if(zEstado()){
    var z=zEstado();
    el.innerHTML=mjCabecera('Hacer el zurrón')+'<div class="end"><h2>Tu zurrón ya está hecho</h2><div class="got">'+z.items.map(function(k){return mjIcon(ZICO[k]);}).join('')+'</div><p class="note">Las decisiones del zurrón solo se toman una vez por viaje.</p>'+
      (DEMO?'<button class="ghost" type="button" id="mjR">Rehacerlo (solo en la prueba)</button>':'')+'<button class="go" type="button" id="mjOk">Volver</button></div>';
    el.querySelector('.x').onclick=cerrar; el.querySelector('#mjOk').onclick=cerrar;
    var r=el.querySelector('#mjR'); if(r) r.onclick=function(){ store.del('zurron'); store.del('fin1'); pinta('inicio'); };
    return;
  }

function jugarSauce(el,cerrar){
  var ID='sauce', TIT='No dormirse bajo el sauce', DUR=40;

  function imagen(k){
    return mjImg(k,
      '<div style="width:100%;height:100%;background:#777;border:2px solid #555"></div>'
    );
  }

  function intro(){
    mjIntro(el,ID,TIT,
      '<p>El viejo sauce murmura junto al río. Bajo sus ramas, los ojos pesan y el sueño parece irresistible…</p>',
      empezar,cerrar
    );
  }

  function empezar(){
    if(el._stop) el._stop();

    el.innerHTML=
      mjCabecera(TIT,
        '<div class="stat"><span id="sauceT">40 s</span></div>'
      )+
      '<style>'+
      '#sauceF .sauceLuz{position:absolute;width:68px;height:68px;padding:8px;border:0;background:transparent;pointer-events:auto;touch-action:manipulation;cursor:pointer;animation:saucePulso .8s ease-in-out infinite alternate;filter:drop-shadow(0 0 10px #f6d076);z-index:6}'+
      '#sauceF .sauceLuz:before{content:"";position:absolute;inset:8px;border:2px solid rgba(250,218,132,.85);border-radius:50%;box-shadow:0 0 15px #f5c65e,inset 0 0 12px #e7a145}'+
      '#sauceF .sauceLuz span{position:relative;display:block;width:100%;height:100%}'+
      '@keyframes saucePulso{from{opacity:.6;transform:scale(.86)}to{opacity:1;transform:scale(1.1)}}'+
      '</style>'+

      '<div class="field" id="sauceF" style="background:#777;touch-action:manipulation">'+

        '<div id="sauceEsc" style="position:absolute;inset:0;overflow:hidden;pointer-events:none">'+

          '<div style="position:absolute;inset:0">'+
            imagen('sauce_fondo')+
          '</div>'+

          '<div id="sauceR1" style="position:absolute;left:-64%;top:12%;width:82%;height:40%;transform-origin:left center">'+
            imagen('sauce_rama')+
          '</div>'+

          '<div id="sauceR2" style="position:absolute;right:-64%;top:23%;width:82%;height:40%;transform-origin:right center;transform:scaleX(-1)">'+
            imagen('sauce_rama')+
          '</div>'+

          '<div style="position:absolute;left:36%;bottom:14%;width:28%;height:37%">'+
            '<div style="position:absolute;inset:0">'+
              imagen('sauce_despierto')+
            '</div>'+
            '<div id="sauceDormido" style="position:absolute;inset:0;opacity:0">'+
              imagen('sauce_dormido')+
            '</div>'+
          '</div>'+

          '<div id="sauceSombra" style="position:absolute;inset:0;background:#060907;opacity:0"></div>'+

          '<div id="sauceOjo1" style="position:absolute;top:0;left:0;right:0;height:0;background:linear-gradient(#0d100b,rgba(13,16,11,.8),transparent)"></div>'+

          '<div id="sauceOjo2" style="position:absolute;bottom:0;left:0;right:0;height:0;background:linear-gradient(transparent,rgba(13,16,11,.8),#0d100b)"></div>'+

        '</div>'+

        '<div class="meter">'+
          '<span>Sueño</span>'+
          '<div class="b"><i id="sauceB" style="background:#ad713a"></i></div>'+
        '</div>'+

        '<div id="sauceChispas" style="position:absolute;inset:0;pointer-events:none;z-index:6"></div>'+

      '</div>';

    var F=el.querySelector('#sauceF');
    var escena=el.querySelector('#sauceEsc');
    var barra=el.querySelector('#sauceB');
    var sombra=el.querySelector('#sauceSombra');
    var dormido=el.querySelector('#sauceDormido');
    var ojo1=el.querySelector('#sauceOjo1');
    var ojo2=el.querySelector('#sauceOjo2');
    var r1=el.querySelector('#sauceR1');
    var r2=el.querySelector('#sauceR2');
    var chispas=el.querySelector('#sauceChispas');
    var reloj=el.querySelector('#sauceT');

    var tiempo=0;
    var sueno=17;
    var maxSueno=17;
    var aciertos=0;
    var perdidas=0;
    var ultimo=performance.now();
    var proxima=.75;
    var luces=[];
    var raf=0;
    var terminado=false;

    /* Oscurecimiento, desenfoque, párpados y ramas */

    function pintar(){
      var p=sueno/100;
      var avance=tiempo/DUR;

      barra.style.width=sueno+'%';

      sombra.style.opacity=
        (Math.pow(p,1.35)*.84).toFixed(3);

      escena.style.filter=
        'brightness('+(1-.53*p).toFixed(3)+') '+
        'blur('+(p*3.2).toFixed(2)+'px)';

      dormido.style.opacity=
        Math.max(0,Math.min(1,(sueno-18)/57)).toFixed(3);

      ojo1.style.height=(p*32).toFixed(1)+'%';
      ojo2.style.height=(p*32).toFixed(1)+'%';

      r1.style.left=
        (-64+24*avance+27*p).toFixed(1)+'%';

      r2.style.right=
        (-64+24*avance+27*p).toFixed(1)+'%';

      reloj.textContent=
        Math.max(0,Math.ceil(DUR-tiempo))+' s';
    }

    /* Aparición aleatoria de luciérnagas */

    function aparecer(){
      if(luces.length>=3) return;

      var b=document.createElement('button');

      b.type='button';
      b.className='sauceLuz';
      b.setAttribute('aria-label','Luciérnaga');

      b.style.left=(10+Math.random()*70)+'%';
      b.style.top=(17+Math.random()*52)+'%';

      b.innerHTML=
        '<span>'+imagen('sauce_chispa')+'</span>';

      chispas.appendChild(b);

      var luz={
        n:b,
        muere:tiempo+1.35+Math.random()*.45
      };

      luces.push(luz);

      b.onclick=function(e){
        e.preventDefault();

        if(terminado||b._usada) return;

        b._usada=true;
        aciertos++;

        sueno=Math.max(0,sueno-25);

        blip();

        if(b.parentNode){
          b.parentNode.removeChild(b);
        }

        var i=luces.indexOf(luz);

        if(i!==-1){
          luces.splice(i,1);
        }

        pintar();
      };
    }

    /* Resultado final */

    function acabar(gano){
      if(terminado) return;

      terminado=true;
      cancelAnimationFrame(raf);

      var i;
      var st=0;

      for(i=0;i<luces.length;i++){
        if(luces[i].n.parentNode){
          luces[i].n.parentNode.removeChild(luces[i].n);
        }
      }

      luces=[];

      if(gano){
        st=maxSueno<48&&perdidas<=6?3:
           maxSueno<78?2:1;
      }

      var txt=!gano?
        'El viejo sauce vence. Los ojos se cierran y las ramas te envuelven…':
        st===3?
        'Ni el murmullo del sauce logra dormirte. ¡Seguís vuestro camino!':
        st===2?
        'Luchas contra el sopor y consigues apartarte de las ramas.':
        'Te despiertas justo a tiempo para escapar del viejo sauce.';

      mjFin(el,ID,TIT,st,txt,empezar,cerrar);
    }

    /* Bucle de juego: sobrevivir 40 segundos */

    function tick(ahora){
      if(terminado) return;

      var dt=Math.max(
        0,
        Math.min(.1,(ahora-ultimo)/1000)
      );

      ultimo=ahora;
      tiempo+=dt;

      sueno=Math.min(
        100,
        sueno+dt*(5.5+3*tiempo/DUR)
      );

      if(sueno>maxSueno){
        maxSueno=sueno;
      }

      if(tiempo>=proxima){
        aparecer();

        proxima=tiempo+1.65+Math.random()*.65;
      }

      var i;

      for(i=luces.length-1;i>=0;i--){
        if(tiempo>=luces[i].muere){

          if(luces[i].n.parentNode){
            luces[i].n.parentNode.removeChild(
              luces[i].n
            );
          }

          luces.splice(i,1);
          perdidas++;

          sueno=Math.min(100,sueno+3);
        }
      }

      pintar();

      if(sueno>=100){
        acabar(false);
        return;
      }

      if(tiempo>=DUR){
        acabar(true);
        return;
      }

      raf=requestAnimationFrame(tick);
    }

    /* Limpieza al cerrar o repetir */

    el._stop=function(){
      terminado=true;
      cancelAnimationFrame(raf);
    };

    pintar();
    raf=requestAnimationFrame(tick);
  }

  intro();
}

      '<div id="canHilo" style="position:absolute;height:6px;border-radius:8px;transform-origin:left center;z-index:5;pointer-events:none;display:none;box-shadow:0 0 12px #f8d78a"></div>'+
      '<div id="canBotones" style="position:absolute;inset:0;z-index:6;pointer-events:none"></div>'+
      '<div id="canCuenta" style="position:absolute;inset:0;display:grid;place-items:center;z-index:7;pointer-events:none;font:800 clamp(65px,22vw,105px) var(--title);color:#f5df9f;text-shadow:0 4px 3px #26180a,0 0 25px #dfaa48">3</div>'+
      '<div class="meter" style="z-index:9;pointer-events:none"><span id="canP">Puntos 0 / 56 · Racha 0</span><div class="b"><i id="canB" style="background:#e2a54a"></i></div></div></div>';

    var F=el.querySelector('#canF'),capa=el.querySelector('#canNotas');
    var carriles=el.querySelector('#canCarriles'),botones=el.querySelector('#canBotones');
    var reloj=el.querySelector('#canT'),marcador=el.querySelector('#canP');
    var barra=el.querySelector('#canB'),cuenta=el.querySelector('#canCuenta'),hilo=el.querySelector('#canHilo');
    var eventos=[],dedos={},brillos=[],puntos=0,racha=0;
    var inicio=performance.now()+3000,raf=0,cerrado=false,audio=null,i;

    try{
      var AC=window.AudioContext||window.webkitAudioContext;
      if(AC){
        audio=new AC();
        if(audio.state==='suspended') audio.resume();
      }

    function tono(f,duracion,vol,espera,final){
      if(!audio||audio.state==='closed') return;
      try{
        var t=audio.currentTime+Math.max(.005,espera||0);
        var o=audio.createOscillator(),g=audio.createGain();
        o.type='triangle';
        o.frequency.setValueAtTime(f,t);
        if(final) o.frequency.linearRampToValueAtTime(final,t+duracion);
        g.gain.setValueAtTime(.0001,t);
        g.gain.exponentialRampToValueAtTime(vol,t+.014);
        g.gain.exponentialRampToValueAtTime(.0001,t+duracion);
        o.connect(g);
        g.connect(audio.destination);
        o.start(t);
        o.stop(t+duracion+.025);
      }catch(e){}
    }

    function pieza(c,tam){
      var e=document.createElement('div');
      e.style.cssText='position:absolute;width:'+tam+'px;height:'+tam+'px;transform:translate(-50%,-50%);display:none';
      e.innerHTML=
        '<div style="position:absolute;inset:0;border:4px solid '+col[c]+';border-radius:50%;background:'+col[c]+'77;box-shadow:0 0 9px '+col[c]+'"></div>'+
        '<div style="position:absolute;inset:5px">'+nota()+'</div>';
      capa.appendChild(e);
      return e;
    }

    function enlace(){
      var e=document.createElement('div');
      e.style.cssText='position:absolute;height:7px;border-radius:4px;box-shadow:0 0 7px #eaca62;transform-origin:left center;display:none';
      capa.appendChild(e);

    }

    for(i=0;i<4;i++){
      var v=document.createElement('div');
      v.style.cssText='width:25%;height:100%;border-right:1px solid rgba(246,237,214,.22);background:linear-gradient(180deg,transparent 0%,'+col[i]+'1c 77%,transparent 100%)';
      carriles.appendChild(v);

      var b=document.createElement('div');
      b.style.cssText=
        'position:absolute;left:'+((i+.5)*25)+'%;top:77%;width:58px;height:58px;transform:translate(-50%,-50%);'+
        'border:5px solid #231c16;border-radius:50%;'+
        'background:radial-gradient(circle at 38% 30%,#ffffff55,'+col[i]+' 58%,#231c16 100%);'+
        'box-shadow:0 3px 0 #130f0a,0 0 8px '+col[i]+';transition:transform .07s,box-shadow .07s';
      botones.appendChild(b);
      brillos.push({el:b,hasta:0,pulso:0});
    }

    for(i=0;i<tipos.length;i++){
      var a=(i*7+Math.floor(i/5))%4,tipo=tipos.charAt(i),b=-1;
      if(tipo==='D') b=(a+1+i%3)%4;
      if(tipo==='L') b=a>1?a-(1+i%2):a+(1+i%2);

      var ev={
        tipo:tipo,a:a,b:b,t:VIAJE+.8+i*PASO,
        estado:0,hecho:0,musica:false,pulsados:{},
        icono:pieza(a,50)
      };
      if(tipo!=='S'){
        ev.linea=enlace();
        ev.icono2=pieza(b,tipo==='D'?50:28);
      }
      eventos.push(ev);
    }

    function tiempo(){
      return (performance.now()-inicio)/1000;
    }

    function carril(e){
      var r=F.getBoundingClientRect();
      return Math.max(0,Math.min(3,Math.floor((e.clientX-r.left)/r.width*4)));
    }

    function enBoton(e){
      var r=F.getBoundingClientRect();
      return Math.abs(e.clientY-r.top-r.height*.77)<=Math.max(48,r.height*.095);
    }

    function flash(c){
      brillos[c].hasta=performance.now()+190;
    }

    function pop(c,t,ok){
      var p=document.createElement('span');
      p.className='canPop';
      p.textContent=t;
      p.style.left=((c+.5)*25)+'%';
      p.style.color=ok?'#fff2b2':'#b9bac0';
      F.appendChild(p);
      p.onanimationend=function(){
        if(p.parentNode) p.parentNode.removeChild(p);
      };
    }

    function juicio(d){
      return Math.abs(d)<=.06?'¡Perfecto!':'¡Bien!';
    }

    function sumar(n){
      puntos+=n;
      racha+=n;
      marcador.textContent='Puntos '+puntos+' / '+MAX+' · Racha '+racha;
      barra.style.width=(100*puntos/MAX)+'%';
      if(typeof blip==='function') blip();
    }

    function ocultar(v){
      v.icono.style.display='none';
      if(v.icono2) v.icono2.style.display='none';
      if(v.linea) v.linea.style.display='none';
    }

    function fallo(v,t){
      if(v.estado) return;
      v.estado=2;
      v.fallo=t;
      racha=0;
      marcador.textContent='Puntos '+puntos+' / '+MAX+' · Racha 0';
      v.icono.style.filter='grayscale(1) brightness(.6)';
      if(v.icono2) v.icono2.style.filter='grayscale(1) brightness(.6)';
      if(v.linea) v.linea.style.filter='grayscale(1)';

      if(v.tipo==='D'){
        pop(v.a,'Fallo',false);
        pop(v.b,'Fallo',false);
      }else{
        pop(v.tipo==='L'&&v.hecho?v.b:v.a,'Fallo',false);
      }
      if(v.tipo==='L') hilo.style.display='none';
    }

    function acierto(v,n){
      v.estado=1;
      ocultar(v);
      sumar(n);
      flash(v.a);
      if(v.b>=0) flash(v.b);
      hilo.style.display='none';
    }

    function moverHilo(v,e){
      var r=F.getBoundingClientRect();
      var x1=(v.a+.5)*r.width/4,y1=.77*r.height;
      var x2=e.clientX-r.left,y2=e.clientY-r.top;
      var dx=x2-x1,dy=y2-y1;

      hilo.style.left=x1+'px';
      hilo.style.top=y1+'px';
      hilo.style.width=Math.sqrt(dx*dx+dy*dy)+'px';
      hilo.style.transform='rotate('+Math.atan2(dy,dx)*180/Math.PI+'deg)';
      hilo.style.background='linear-gradient(90deg,'+col[v.a]+','+col[v.b]+')';
      hilo.style.display='block';
    }

    F.onpointerdown=function(e){
      if(cerrado||tiempo()<0) return;
      e.preventDefault();
      if(!enBoton(e)) return;

      var c=carril(e),t=tiempo(),v=null,dist=VENTANA+.001,j,d,q;
      dedos[e.pointerId]={c:c,ev:null};
      brillos[c].pulso=performance.now()+110;

      try{F.setPointerCapture(e.pointerId);}catch(err){}

      for(j=0;j<eventos.length;j++){
        q=eventos[j];
        if(q.estado||(q.tipo==='L'?(q.a!==c||q.hecho):(q.a!==c&&q.b!==c))) continue;
        d=Math.abs(t-q.t);
        if(d<=VENTANA&&d<dist){
          v=q;
          dist=d;
        }
      }

      if(!v) return;

      if(v.tipo==='S'){
        pop(c,juicio(t-v.t),true);
        acierto(v,1);
        return;
      }

      if(v.tipo==='L'){
        v.hecho=1;
        v.dedo=e.pointerId;
        dedos[e.pointerId].ev=v;
        sumar(1);
        flash(c);
        pop(c,juicio(t-v.t),true);
        moverHilo(v,e);
        return;
      }

      if(v.pulsados[c]) return;
      v.pulsados[c]={id:e.pointerId,t:t};
      dedos[e.pointerId].ev=v;
      dedos[e.pointerId].hitLane=c;

      var p1=v.pulsados[v.a],p2=v.pulsados[v.b];

      if(p1&&p2&&p1.id!==p2.id&&Math.abs(p1.t-p2.t)<=VENTANA){
        pop(v.a,juicio(p1.t-v.t),true);
        pop(v.b,juicio(p2.t-v.t),true);
        acierto(v,2);
      }
    };

    function completarArrastre(p,e){
      var v=p.ev;
      if(!v||v.tipo!=='L'||!v.hecho||v.estado||v.dedo!==e.pointerId) return false;

      if(carril(e)===v.b&&tiempo()<=v.t+COLA){
        pop(v.b,'¡Bien!',true);
        tono(frec[v.b],.16,.055);
        acierto(v,1);
        return true;
      }
      return false;
    }

    F.onpointermove=function(e){
      var p=dedos[e.pointerId];
      if(!p||cerrado) return;
      e.preventDefault();
      p.c=carril(e);

      if(p.ev&&p.ev.tipo==='L'&&!p.ev.estado){
        moverHilo(p.ev,e);
        completarArrastre(p,e);
      }
    };

    function soltar(e){
      var p=dedos[e.pointerId];
      if(!p) return;
      var v=p.ev;

      if(v&&!v.estado){
        if(v.tipo==='L'&&v.dedo===e.pointerId){
          if(e.type==='pointerup') completarArrastre(p,e);
          if(!v.estado) fallo(v,tiempo());
        }else if(v.tipo==='D'&&v.pulsados[p.hitLane]&&v.pulsados[p.hitLane].id===e.pointerId){
          delete v.pulsados[p.hitLane];
        }
      }
      delete dedos[e.pointerId];
    }

    F.onpointerup=soltar;
    F.onpointercancel=soltar;
    F.onlostpointercapture=soltar;

    function posicionar(e,c,y){
      e.style.left=((c+.5)*25)+'%';
      e.style.top=y+'%';
      e.style.display='block';
    }

    function dibujar(v,t){
      if(v.estado===1){
        ocultar(v);
        return;
      }
      if(v.estado===2&&t>v.fallo+.28){
        ocultar(v);
        return;
      }

      var resto=v.t-t,y=77-resto/VIAJE*68,y2=y;

      if(v.tipo==='L'){
        if(v.hecho){
          y=77;
          y2=77-((v.t+COLA-t)/VIAJE)*68;
        }else{
          y2=y-COLA/VIAJE*68;
        }
      }

      if(v.estado!==2&&resto>VIAJE){
        ocultar(v);
        return;
      }
      if(y>115||y< -25){
        ocultar(v);
        return;
      }

      posicionar(v.icono,v.a,y);
      if(v.icono2) posicionar(v.icono2,v.b,y2);

      if(v.linea){
        var x1=(v.a+.5)*F.clientWidth/4,x2=(v.b+.5)*F.clientWidth/4;
        var yy1=y*F.clientHeight/100,yy2=y2*F.clientHeight/100;
        var dx=x2-x1,dy=yy2-yy1;

        v.linea.style.left=x1+'px';
        v.linea.style.top=yy1+'px';
        v.linea.style.width=Math.sqrt(dx*dx+dy*dy)+'px';
        v.linea.style.transform='rotate('+Math.atan2(dy,dx)*180/Math.PI+'deg)';
        v.linea.style.background=v.tipo==='D'?
          'linear-gradient(90deg,#bd902f,#fae1a0,#bd902f)':
          'linear-gradient(90deg,'+col[v.a]+','+col[v.b]+')';
        v.linea.style.display='block';
      }
    }

    function limpiar(){
      if(cerrado) return;
      cerrado=true;
      cancelAnimationFrame(raf);
      F.onpointerdown=null;
      F.onpointermove=null;
      F.onpointerup=null;
      F.onpointercancel=null;
      F.onlostpointercapture=null;

      if(audio){
        try{audio.close();}catch(e){}
        audio=null;
      }
    }

    function terminar(){
      if(cerrado) return;
      var p=puntos/MAX;
      var st=p>=.85?3:p>=.60?2:p>=.35?1:0;
      var frases=[
        'La melodía se dispersa por el bosque y apenas consigues seguirla.',
        'Algunas notas se escapan, pero la canción sigue viva en tus pasos.',
        'Tu ritmo acompaña la alegría de la casa hasta el último compás.',
        'Cada nota encaja a la perfección. La música ilumina el camino.'
      ];

      limpiar();
      mjFin(el,ID,TIT,st,frases[st],empezar,cerrar);
    }

    function tick(ahora){
      if(cerrado) return;

      var t=(ahora-inicio)/1000,j,v,resto;
      var listos=[0,0,0,0],pres=[0,0,0,0];

      reloj.textContent=Math.max(0,Math.ceil(FIN-Math.max(0,t)))+' s';

      if(t<0){
        cuenta.textContent=Math.ceil(-t);
        raf=requestAnimationFrame(tick);
        return;
      }

      cuenta.style.display='none';

      for(j=0;j<eventos.length;j++){
        v=eventos[j];
        resto=v.t-t;

        if(!v.musica&&resto<=.13&&resto>-.12){
          v.musica=true;
          var espera=Math.max(.005,resto);

          if(v.tipo==='D'){
            tono(frec[v.a],.25,.044,espera);
            tono(frec[v.b],.25,.036,espera);
          }else if(v.tipo==='L'){
            tono(frec[v.a],COLA,.055,espera,frec[v.b]);
          }else{
            tono(frec[v.a],.22,.05,espera);
          }

          if(j%4===0) tono(196,.25,.014,espera);
        }

        if(!v.estado&&((v.tipo==='L'&&v.hecho)?t>v.t+COLA:t>v.t+VENTANA)){
          fallo(v,t);
        }

        if(!v.estado&&Math.abs(resto)<=VENTANA){
          if(v.tipo!=='L'||!v.hecho) listos[v.a]=1;
          if(v.tipo==='D') listos[v.b]=1;
        }
        if(!v.estado&&v.tipo==='L'&&v.hecho) listos[v.b]=1;

        dibujar(v,t);
      }

      for(j in dedos){
        if(dedos.hasOwnProperty(j)) pres[dedos[j].c]=1;
      }

      for(j=0;j<4;j++){
        var listo=listos[j];
        var pr=pres[j]||brillos[j].pulso>ahora;
        var dest=brillos[j].hasta>ahora;
        var enRacha=racha>=10;
        var b=brillos[j].el;

        b.style.transform='translate(-50%,-50%) scale('+(pr?.9:listo?1.12:1)+')';
        b.style.boxShadow='0 3px 0 #130f0a,0 0 '+(pr||listo||dest||enRacha?25:8)+'px '+col[j]+(listo?',0 0 0 4px #fff0b8':'');
        b.style.borderColor=listo?'#ffebaf':'#231c16';
      }

      if(t>=FIN){
        terminar();
        return;
      }
      raf=requestAnimationFrame(tick);
    }

    el._stop=limpiar;
    raf=requestAnimationFrame(tick);
  }

  intro();
}

          if(j!==hueco)nodos.push(nuevoNodo(j));
        }
      }else{
        for(j=0;j<3;j++)nodos.push(nuevoNodo(j));
      }

      var destino=hueco===0?1:
        hueco===2?1:
        (Math.random()<.5?0:2);

      arboles.push({
        tipo:tipo,n:nodos,y:-.17,
        abierto:false,hueco:hueco,destino:destino
      });
    }

    function perder(){
      if(invulnerable>0)return;

      vidas--;
      invulnerable=1;

      hojas[vidas].style.filter='grayscale(1)';
      hojas[vidas].style.opacity='.22';

      F.style.animation='none';
      F.offsetWidth;
      F.style.animation='bosGolpe .24s';

      ficha.style.animation='bosParpadeo .16s linear infinite';

      if(vidas===0)terminar(false);
    }

    function limpiar(){
      if(terminado)return;

      terminado=true;
      cancelAnimationFrame(raf);

      F.onpointerdown=null;
      F.onpointermove=null;
      F.onpointerup=null;
      F.onpointercancel=null;
      F.onlostpointercapture=null;
    }

    function terminar(gano){
      if(terminado)return;

      var st=gano?vidas:0;

      var textos=[
        'Los troncos cierran el último paso y el bosque os retiene.',
        'Alcanzáis el claro con las últimas fuerzas y una sola hoja.',
        'Las ramas os rozan, pero lográis salir del bosque.',
        'Ni una rama os alcanza: la colina aparece ante vosotros.'
      ];

      limpiar();
      mjFin(el,ID,TIT,st,textos[st],empezar,cerrar);
    }

    F.onpointerdown=function(e){
      if(terminado||performance.now()<t0||activo)return;

      e.preventDefault();

      activo={
        id:e.pointerId,
        x:e.clientX,
        movio:false
      };

      try{
        F.setPointerCapture(e.pointerId);
      }catch(ex){}
    };

    F.onpointermove=function(e){
      if(!activo||activo.id!==e.pointerId||terminado)return;

      e.preventDefault();

      var paso=Math.max(30,F.clientWidth*.09);
      var dx=e.clientX-activo.x;

      while(Math.abs(dx)>=paso){
        carril(lane+(dx>0?1:-1));
        activo.x+=dx>0?paso:-paso;
        activo.movio=true;
        dx=e.clientX-activo.x;
      }
    };

    function soltar(e){
      if(!activo||activo.id!==e.pointerId)return;

      if(e.type==='pointerup'&&!activo.movio){
        var x=e.clientX-F.getBoundingClientRect().left;
        carril(lane+(x<F.clientWidth/2?-1:1));
      }

      activo=null;
    }

    F.onpointerup=soltar;
    F.onpointercancel=soltar;
    F.onlostpointercapture=soltar;

    function tick(ahora){
      if(terminado)return;

      var dt=Math.max(0,Math.min(.05,(ahora-anterior)/1000));
      anterior=ahora;

      var t=(ahora-t0)/1000;

      if(t<0){
        cuenta.textContent=Math.ceil(-t);
        raf=requestAnimationFrame(tick);
        return;
      }

      cuenta.style.display='none';
      reloj.textContent=Math.max(0,Math.ceil(DUR-t))+' s';

      var vel=.32+.19*Math.min(1,t/DUR);
      var H=F.clientHeight;

      scroll=(scroll+dt*vel*H)%(2*H);

      bg1.style.transform='translate3d(0,'+(scroll-2*H)+'px,0)';
      bg2.style.transform='translate3d(0,'+scroll+'px,0)';

      if(invulnerable>0){
        invulnerable=Math.max(0,invulnerable-dt);

        if(!invulnerable){
          ficha.style.animation='none';
        }
      }

      if(t>=DUR&&!escenaFinal){
        escenaFinal=true;
        claro.style.display='block';

        for(var q=0;q<arboles.length;q++){
          for(var p=0;p<arboles[q].n.length;p++){
            arboles[q].n[p].el.remove();
          }
        }

        arboles=[];
      }

      if(escenaFinal){
        claroY+=dt*.72;
        claro.style.top=(claroY*100)+'%';

        if(claroY>=Y){
          terminar(true);
          return;
        }

      }else{
        if(t>=proxima&&t<28.2){
          fila();
          proxima=t+Math.max(.88,1.26-.32*t/DUR);
        }

        for(var i=arboles.length-1;i>=0;i--){
          var r=arboles[i];
          r.y+=dt*vel;

          if(r.tipo==='c'&&!r.abierto&&r.y>=Y-vel*.6){
            r.abierto=true;

            r.n[r.hueco].c=r.destino;
            r.n[r.hueco].el.style.left=
              ((r.destino+.5)*100/3)+'%';
          }

          for(var j=0;j<r.n.length;j++){
            var a=r.n[j];

            a.el.style.top=(r.y*100)+'%';

            if(!invulnerable&&
               Math.abs(r.y-Y)<.085&&
               a.c===lane){

              perder();

              if(terminado)return;
            }
          }

          if(r.y>1.2){
            for(j=0;j<r.n.length;j++){
              r.n[j].el.remove();
            }

            arboles.splice(i,1);
          }
        }
      }

      raf=requestAnimationFrame(tick);
    }

    carril(1);
    el._stop=limpiar;
    raf=requestAnimationFrame(tick);
  }

  intro();
}

    function metal(){
      if(!audio||audio.state==='closed')return;

      try{
        if(audio.state==='suspended')audio.resume();

        var t=audio.currentTime;
        var o1=audio.createOscillator();
        var o2=audio.createOscillator();
        var g=audio.createGain();

        o1.type='sine';

        o1.frequency.setValueAtTime(1150,t);

        if(d.parentNode)d.parentNode.removeChild(d);

      puntos++;
      puntosEl.textContent=puntos+' cortes';

      metal();
      destello(h.px,h.py);

      h.el.style.transition='opacity .17s,transform .17s';
      h.el.style.opacity='0';
      h.el.style.transform='translate(-50%,-50%) scale(.1)';
      h.borrar=performance.now()+180;

      var mejor=null,dist=56,k,h,d;

        d=Math.sqrt(
          Math.pow(x-h.px,2)+
          Math.pow(y-h.py,2)

        if(d<dist){

          mejor=h;

      if(mejor)cortar(mejor);
    };

    function perderAmigo(k){
      if(amigos[k].muerto)return;

      amigos[k].muerto=true;
      amigos[k].cara.style.filter='grayscale(1) brightness(.55)';
      amigos[k].cara.style.borderColor='#818e93';
      amigos[k].cara.style.boxShadow='0 0 11px #8aaab6';
      amigos[k].cara.style.animation='none';

      var otros=vivos(),z,h;

      for(z=manos.length-1;z>=0;z--){
        h=manos[z];

        if(!h.muerta&&h.target===k){

      if(t<0){
        cuenta.textContent=Math.ceil(-t);
        raf=requestAnimationFrame(tick);
        return;
      }

      cuenta.style.display='none';
      reloj.textContent=Math.max(0,Math.ceil(DUR-t))+' s';

      if(t>=DUR&&!alba){
        alba=true;
        albaInicio=ahora;
        L.style.opacity='1';

        for(i=0;i<manos.length;i++){
          manos[i].el.style.transition='opacity .7s,transform .7s';
          manos[i].el.style.opacity='0';
          manos[i].el.style.transform='translate(-50%,-50%) scale(.2)';
        }
      }

      if(alba){
        if(ahora-albaInicio>=900){
          terminar();
          return;
        }

        raf=requestAnimationFrame(tick);
        return;
      }

      if(t>=siguiente){
        var max=t<8?3:t<18?4:5;

        if(manos.length<max)crear(t);

        siguiente=t+.85-.5*Math.min(1,t/DUR);
      }

      var w=F.clientWidth,hgt=F.clientHeight;

      for(i=manos.length-1;i>=0;i--){
        var h=manos[i];

        if(h.muerta){
          if(ahora>=h.borrar){
            h.el.remove();
            manos.splice(i,1);
          }
          continue;
        }

        var destino=amigos[h.target];

        if(destino.muerto){
          h.el.remove();
          manos.splice(i,1);
          continue;
        }

        var dx=(destino.x-h.x)*w;
        var dy=(destino.y-h.y)*hgt;
        var distancia=Math.sqrt(dx*dx+dy*dy);

        if(distancia<30){
          perderAmigo(h.target);
          if(terminado)return;
          continue;
        }

        var ux=dx/distancia,uy=dy/distancia;
        var vel=95+100*Math.min(1,t/DUR);

        h.x+=ux*vel*dt/w;
        h.y+=uy*vel*dt/hgt;

        var vaiven=Math.sin((t-h.t)*7+h.phase)*5;

        h.px=h.x*w-uy*vaiven;
        h.py=h.y*hgt+ux*vaiven;

        h.el.style.left=h.px+'px';
        h.el.style.top=h.py+'px';

        h.el.style.transform=
          'translate(-50%,-50%) rotate('+
          Math.atan2(dx,-dy)*180/Math.PI+'deg)';
      }

      raf=requestAnimationFrame(tick);
    }

    el.querySelector('.x').onclick=cerrar;
    el._stop=limpiar;
    raf=requestAnimationFrame(tick);
  }

  intro();
}

function haceTxt(t){ if(!t) return null; var d=new Date(t); if(isNaN(d)) return null; var hoy=hoyMadrid(), f=d.toLocaleDateString('sv-SE',{timeZone:'Europe/Madrid'}),
  h=d.toLocaleTimeString('es-ES',{timeZone:'Europe/Madrid',hour:'2-digit',minute:'2-digit'}), n=Math.round((Date.parse(hoy)-Date.parse(f))/864e5);
  return {n:n,txt:n<=0?'hoy '+h:n===1?'ayer '+h:'hace '+n+' días ('+f.slice(8,10)+'/'+f.slice(5,7)+')'}; }
function actividadPanel(){ var B=$('authBox');
  B.innerHTML='<div class="menu mform"><p class="hola">Quién usa la app</p><div id="actL" class="actL"><p class="dato">Cargando…</p></div><button type="button" class="sec" id="aVolver">‹ Volver al Máster</button></div>';
  $('aVolver').onclick=masterPanel;
  rpc('loc_actividad').then(function(r){ if(!Array.isArray(r)) throw new Error('sin datos');
    var L=r.map(function(x){ var ab=haceTxt(x.abierto), se=haceTxt(x.sesion), sy=haceTxt(x.ultima_sync), ult=ab||se; return {x:x,ab:ab,se:se,sy:sy,n:ult?ult.n:9999}; });
    L.sort(function(a,b){ return a.n-b.n||String(a.x.nombre).localeCompare(b.x.nombre); });
    $('actL').innerHTML=L.map(function(o){ var x=o.x, c=o.n<=0?'v':o.n<=2?'a':'r';
      var linea=!x.cuenta?'Sin cuenta todavía':o.ab?'Abrió el juego '+o.ab.txt:o.se?'Activo '+o.se.txt+' <i>(aprox.)</i>':'Sin datos de uso';
      return '<div class="actF"><span class="pt '+(x.cuenta?c:'r')+'"></span><div><b>'+x.nombre+'</b><span>'+linea+'</span>'+
        '<small>Pasos: '+(o.sy?'sincronizó '+o.sy.txt:'nunca')+' · 7 días: '+Number(x.pasos_7||0).toLocaleString('es-ES')+(x.dias_14!=null&&o.ab?' · abrió '+x.dias_14+' de 14 días':'')+'</small></div></div>'; }).join('')+
      '<p class="dato" style="font-size:.74rem;color:#d9c49a">Verde: hoy · ámbar: hace 1-2 días · rojo: más. «Aprox.» es la última vez que su sesión se renovó, hasta que haya datos exactos de apertura.</p>';
  }).catch(function(e){ $('actL').innerHTML='<p class="dato">No se ha podido cargar: '+(e&&e.message||e)+'. ¿Está ejecutado <b>la-otra-comunidad-actividad.sql</b> en Supabase?</p>'; }); }

/* ---------- carta del día (imagen para mandar al grupo) ---------- */
function cartaDia(){ if(!me) return; var Wc=1080, Hc=1350, c=document.createElement('canvas'); c.width=Wc; c.height=Hc; var x=c.getContext('2d');
  var bg=new Image(), lg=new Image(), hb=new Image(), hg=new Image(), H=hoguera(), R=retoDatos(), t=T[tramoAt(km)], car=0;
  function listo(){ if(++car<3) return;
    try{ var s=Math.max(Wc/bg.width,Hc/bg.height); x.imageSmoothingEnabled=false; x.drawImage(bg,(Wc-bg.width*s)/2,(Hc-bg.height*s)*.35,bg.width*s,bg.height*s); }catch(e){ x.fillStyle='#3b2b17'; x.fillRect(0,0,Wc,Hc); }
    var g=x.createLinearGradient(0,Hc*.45,0,Hc); g.addColorStop(0,'rgba(15,10,5,0)'); g.addColorStop(1,'rgba(15,10,5,.92)'); x.fillStyle=g; x.fillRect(0,0,Wc,Hc);
    try{ x.imageSmoothingEnabled=true; var lw=760; x.drawImage(lg,(Wc-lw)/2,30,lw,lw*lg.height/lg.width); }catch(e){}
    try{ x.imageSmoothingEnabled=false; x.drawImage(hb,Wc/2-53*5.2/2-60,Hc*.36,53*5.2,74*5.2); }catch(e){}
    try{ if(hg.width){ x.imageSmoothingEnabled=true; x.drawImage(hg,Wc/2+90,Hc*.36+74*5.2-300,150,300); } }catch(e){}
    x.textAlign='center'; x.fillStyle='#f6dc9a'; x.shadowColor='#000'; x.shadowBlur=8;
    x.font='700 64px Cinzel, Georgia, serif'; x.fillText(me.nombre,Wc/2,Hc*.36+74*5.2+70);
    x.font='600 40px Alegreya Sans, sans-serif'; x.fillStyle='#f3ead2'; x.fillText(t.name+' · km '+fmt(km),Wc/2,Hc*.36+74*5.2+124);
    x.font='800 58px Alegreya Sans, sans-serif'; x.fillStyle='#ffe7a8'; x.fillText(Number(stepsToday||0).toLocaleString('es-ES')+' pasos hoy',Wc/2,Hc-170);
    x.font='600 36px Alegreya Sans, sans-serif'; x.fillStyle='#f3ead2'; x.fillText((H.fase>=0?HFASES[H.fase][1]:'Hoguera')+': '+H.dias+(H.dias===1?' día':' días')+'  ·  Reto: '+fmt(R.km)+' de '+R.obj+' km',Wc/2,Hc-105);
    x.font='italic 30px Alegreya Sans, sans-serif'; x.fillStyle='rgba(243,234,210,.8)'; x.fillText(new Date().toLocaleDateString('es-ES',{weekday:'long',day:'numeric',month:'long'}),Wc/2,Hc-50);
    c.toBlob(function(bl){ var f=new File([bl],'carta-'+hoyMadrid()+'.png',{type:'image/png'});
      if(navigator.canShare&&navigator.canShare({files:[f]})){ navigator.share({files:[f],title:'La Otra Comunidad'}).catch(function(){ verCarta(c); }); } else verCarta(c); },'image/png'); }
  bg.onload=bg.onerror=listo; lg.onload=lg.onerror=listo; hb.onload=hb.onerror=listo;
  try{ bg.src=cv.toDataURL(); }catch(e){ listo(); } lg.src=M.logo||'assets/logo.webp'; if(H.fase>=0&&M.hoguera) hg.src=M.hoguera[H.fase][0];
  var u=(typeof hobbitVestido==='function')?hobbitVestido(me.hobbit,eqPuesto(),8):null; if(u) hb.src=u; else listo(); }
function verCarta(c){ var d=document.createElement('div'); d.className='carta'; d.innerHTML='<img alt="Carta del día"><p>Mantén pulsada la imagen para guardarla o compartirla en el grupo.</p><button type="button">Cerrar</button>';
